<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6ec3f4">
<title>Ant Colony</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#4a2e1a}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Ant Colony: a no-controls, no-lose ant farm for small kids.
// World is 1600x1000 units; the surface is at y=SURF. Everything is vector-drawn.
// ---------------------------------------------------------------------------
const W = 1600, H = 1000, SURF = 250;
const params = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, Math.min(60, +params.get('speed') || 1));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function hx(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Colony layout -------------------------------------------------------
// Chambers are ellipses; ants walk along the floor (the lower half of the ellipse).
const CH = {
  F: { cx: 470, cy: 445, rx: 165, ry: 62, door: 0.92 },   // food store
  N: { cx: 1160, cy: 600, rx: 190, ry: 70, door: -0.92 }, // nursery
  Q: { cx: 480, cy: 812, rx: 185, ry: 80, door: 0.92 },   // queen's room
};
function floorPt(ch, u, lift = 0) {
  return { x: ch.cx + u * ch.rx, y: ch.cy + ch.ry * Math.sqrt(Math.max(0, 1 - u * u)) - lift };
}
function floorY(ch, x) { const u = (x - ch.cx) / ch.rx; return ch.cy + ch.ry * Math.sqrt(Math.max(0, 1 - u * u)); }
const AS = 1.75; // ant drawing scale
const LIFT = 6 * AS; // ant body centre above the floor
const N = {
  E: { x: 800, y: SURF - LIFT },
  A: { x: 815, y: 362 },
  F: floorPt(CH.F, CH.F.door, LIFT),
  B: { x: 878, y: 548 },
  N: floorPt(CH.N, CH.N.door, LIFT),
  C: { x: 772, y: 724 },
  Q: floorPt(CH.Q, CH.Q.door, LIFT),
};
const EDGES = [['E', 'A'], ['A', 'F'], ['A', 'B'], ['B', 'N'], ['B', 'C'], ['C', 'Q']];
const ADJ = {}; for (const k in N) ADJ[k] = [];
for (const [a, b] of EDGES) { ADJ[a].push(b); ADJ[b].push(a); }
function route(a, b) {
  const prev = { [a]: null }, q = [a];
  while (q.length) { const n = q.shift(); if (n === b) break; for (const m of ADJ[n]) if (!(m in prev)) { prev[m] = n; q.push(m); } }
  const r = []; for (let n = b; n != null; n = prev[n]) r.unshift(n); return r;
}
// A "loc" is where an ant can stand: {node:'F',u} on a chamber floor, {node:'E',sx} on
// the surface, or {node:'A'} at a tunnel bend.
function locPt(loc) {
  if (loc.u != null) return floorPt(CH[loc.node], loc.u, LIFT);
  if (loc.sx != null) return { x: loc.sx, y: SURF - LIFT };
  return N[loc.node];
}
function nodeLoc(id) { return CH[id] ? { node: id, u: CH[id].door } : id === 'E' ? { node: 'E', sx: N.E.x } : { node: id }; }
const P = loc => ({ ...locPt(loc), loc });
function floorSeg(id, u0, u1) {
  const pts = [], n = Math.max(1, Math.ceil(Math.abs(u1 - u0) / 0.1));
  for (let i = 1; i <= n; i++) pts.push(P({ node: id, u: lerp(u0, u1, i / n) }));
  return pts;
}
function buildPath(loc, dest) {
  const pts = [P(loc)];
  if (loc.node === dest.node) {
    if (CH[loc.node]) return pts.concat(floorSeg(loc.node, loc.u, dest.u));
    pts.push(P(dest)); return pts;
  }
  if (CH[loc.node]) pts.push(...floorSeg(loc.node, loc.u, CH[loc.node].door));
  else if (loc.node === 'E') pts.push(P(nodeLoc('E')));
  const r = route(loc.node, dest.node);
  for (let i = 1; i < r.length; i++) pts.push(P(nodeLoc(r[i])));
  if (CH[dest.node]) pts.push(...floorSeg(dest.node, CH[dest.node].door, dest.u));
  else if (dest.node === 'E') pts.push(P(dest));
  return pts;
}

// ---- Canvas / view -------------------------------------------------------
const cv = document.getElementById('c'), g = cv.getContext('2d');
let cw, chh, dpr, scale, offX, offY, visL, visR, visT, visB, bg;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = innerWidth; chh = innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(chh * dpr);
  scale = Math.min(chh / H, cw / 1300);
  offX = cw / 2 - 915 * scale;
  offY = (chh - H * scale) * 0.6;
  visL = -offX / scale; visR = (cw - offX) / scale; visT = -offY / scale; visB = (chh - offY) / scale;
  buildBg();
}
const worldT = () => g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);

// Static ground layer: dirt, pebbles, roots, then tunnels/chambers carved in.
function buildBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'), R = mulberry(7);
  b.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  const L = visL - 20, Rr = visR + 20, B = visB + 20;
  const gr = b.createLinearGradient(0, SURF, 0, H);
  gr.addColorStop(0, '#9a6638'); gr.addColorStop(0.35, '#7d5030'); gr.addColorStop(1, '#4f3120');
  b.fillStyle = gr; b.fillRect(L, SURF, Rr - L, B - SURF);
  // soft strata
  for (let i = 0; i < 7; i++) {
    const y = SURF + 70 + i * 105 + R() * 40;
    b.fillStyle = `rgba(${R() < .5 ? '60,35,18' : '150,105,65'},0.10)`;
    b.beginPath(); b.moveTo(L, y);
    for (let x = L; x <= Rr; x += 80) b.lineTo(x, y + Math.sin(x * 0.006 + i) * 12);
    b.lineTo(Rr, y + 40); b.lineTo(L, y + 40); b.fill();
  }
  // roots hanging from the grass
  b.lineCap = 'round';
  for (let i = 0; i < 26; i++) {
    let x = L + R() * (Rr - L), y = SURF + 4; if (Math.abs(x - 800) < 60) continue;
    b.strokeStyle = `rgba(${200 + R() * 30 | 0},${170 + R() * 30 | 0},${120 + R() * 30 | 0},0.55)`;
    b.lineWidth = 1.2 + R() * 1.5;
    b.beginPath(); b.moveTo(x, y);
    const len = 20 + R() * 60;
    for (let s = 0; s < len; s += 6) { x += (R() - 0.5) * 6; y += 6; b.lineTo(x, y); }
    b.stroke();
  }
  // pebbles
  for (let i = 0; i < 260; i++) {
    const x = L + R() * (Rr - L), y = SURF + 14 + R() * (B - SURF);
    const r = 1.5 + R() * R() * 9, c = 90 + R() * 70 | 0;
    b.fillStyle = `rgba(${c + 20},${c},${c - 15},${0.35 + R() * 0.4})`;
    b.beginPath(); b.ellipse(x, y, r * 1.3, r, R() * 3, 0, 7); b.fill();
  }
  // carve tunnels & chambers: rim, then interior
  const carve = (w, col) => {
    b.strokeStyle = col; b.fillStyle = col; b.lineWidth = w;
    for (const [p, q] of EDGES) {
      const a = N[p], c = N[q];
      b.beginPath(); b.moveTo(a.x, a.y + 4); b.lineTo(c.x, c.y + 4); b.stroke();
    }
    const pad = (w - 44) / 2;
    for (const k in CH) { const c = CH[k]; b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 14 + pad, c.ry + 14 + pad, 0, 0, 7); b.fill(); }
  };
  carve(56, '#5c3a22'); carve(44, '#2e1e13');
  for (const k in CH) { // warm glow + floor tint
    const c = CH[k], rg = b.createRadialGradient(c.cx, c.cy + 20, 10, c.cx, c.cy, c.rx + 20);
    rg.addColorStop(0, 'rgba(255,190,110,0.16)'); rg.addColorStop(1, 'rgba(255,190,110,0)');
    b.fillStyle = rg; b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 14, c.ry + 14, 0, 0, 7); b.fill();
    b.strokeStyle = 'rgba(120,80,50,0.5)'; b.lineWidth = 3;
    b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 12, c.ry + 12, 0, 0.15, Math.PI - 0.15); b.stroke();
  }
  // top-soil band + graveyard patch + anthill mound
  b.fillStyle = '#6b4a2a'; b.fillRect(L, SURF - 1, Rr - L, 9);
  b.fillStyle = '#7a5a3c';
  b.beginPath(); b.ellipse(1450, SURF + 2, 105, 9, 0, 0, 7); b.fill();
  for (let i = 0; i < 30; i++) {
    b.fillStyle = `rgba(${150 + R() * 50 | 0},${130 + R() * 40 | 0},${100 + R() * 40 | 0},0.8)`;
    b.beginPath(); b.ellipse(1355 + R() * 190, SURF - 1 + R() * 6, 1.5 + R() * 2.5, 1.2 + R() * 1.6, 0, 0, 7); b.fill();
  }
  b.fillStyle = '#a06c3c';
  for (const s of [-1, 1]) { b.beginPath(); b.ellipse(800 + s * 36, SURF + 1, 28, 15, 0, Math.PI, 0); b.fill(); }
  b.fillStyle = '#2e1e13'; b.beginPath(); b.ellipse(800, SURF + 2, 15, 7, 0, 0, 7); b.fill();
  for (let i = 0; i < 40; i++) { // crumbs of dug-out soil on the mound
    const a = R() * Math.PI, rr = 20 + R() * 40;
    b.fillStyle = `rgba(${170 + R() * 40 | 0},${115 + R() * 30 | 0},${60 + R() * 30 | 0},0.9)`;
    b.beginPath(); b.arc(800 + Math.cos(a) * rr * (R() < .5 ? -1 : 1), SURF - Math.sin(a) * 8 * R(), 1 + R() * 1.6, 0, 7); b.fill();
  }
}

// ---- Scenery (sky, clouds, grass, flowers) ------------------------------
const SR = mulberry(42);
const stars = Array.from({ length: 90 }, () => ({ x: -900 + SR() * 3400, y: -1200 + SR() * (SURF + 1150), r: 0.6 + SR() * 1.4, p: SR() * 6 }));
const clouds = Array.from({ length: 6 }, (_, i) => ({ x: SR() * 2400 - 400, y: 40 + SR() * 120, s: 0.6 + SR() * 0.8, v: 6 + SR() * 8 }));
const blades = [];
for (let x = -1400; x < 3000; x += 3.2 + SR() * 3) {
  if (Math.abs(x - 800) < 62) continue;
  const grave = x > 1350 && x < 1550;
  blades.push({ x, h: (grave ? 5 : 10) + SR() * (grave ? 7 : 22), lean: (SR() - 0.5) * 8, ph: SR() * 6, c: SR() * 4 | 0 });
}
const BLADE_COL = ['#3f9a3a', '#55b246', '#2f7f30', '#6cc350'];
const flowers = [
  { x: 205, h: 54, c: '#ffd23f' }, { x: 380, h: 38, c: '#ff7aa8' }, { x: 610, h: 46, c: '#ffffff' },
  { x: 1020, h: 60, c: '#b07cff' }, { x: 1210, h: 40, c: '#ffd23f' }, { x: 1640, h: 50, c: '#ff7aa8' }, { x: -60, h: 44, c: '#ffffff' },
];
const SKY = [ // [phase, top, bottom]
  [0.00, '#6ec3f4', '#d5f1ff'], [0.52, '#6ec3f4', '#d5f1ff'], [0.60, '#5b5fa6', '#ffb27a'],
  [0.68, '#0d1838', '#2b3a6e'], [0.90, '#0d1838', '#2b3a6e'], [0.96, '#6a6fb8', '#ffc490'], [1.00, '#6ec3f4', '#d5f1ff'],
];
function skyAt(p) {
  for (let i = 1; i < SKY.length; i++) if (p <= SKY[i][0]) {
    const [p0, t0, b0] = SKY[i - 1], [p1, t1, b1] = SKY[i], t = (p - p0) / (p1 - p0 || 1);
    return [mix(t0, t1, t), mix(b0, b1, t)];
  }
  return [SKY[0][1], SKY[0][2]];
}
const DAY_LEN = 300;
function nightness(p) { // 0 = full day, 1 = full night
  if (p < 0.52) return 0; if (p < 0.68) return (p - 0.52) / 0.16; if (p < 0.9) return 1; if (p < 1) return 1 - (p - 0.9) / 0.1; return 0;
}

// ---- Simulation state ----------------------------------------------------
const POP_CAP = 30, BROOD_CAP = 12, STORE_CAP = 48, NURSERY_SLOTS = 12;
const slotU = i => -0.8 + i * 0.13;
const qEggU = i => -0.9 + i * 0.075;
const FOOD = { seed: '#d9b46a', berry: '#d23a4e', crumb: '#f2d27c', leaf: '#6dbb4a', blue: '#5566d6' };
const S = {
  t: 0, day: 0.08,
  ants: [], invaders: [], corpses: [], brood: [], store: [], food: [], parts: [],
  queen: { u: 0.02, layT: 4, hunger: 0.5, claimed: false, pulse: 0 },
  nextFood: 2, nextRaid: 35,
  stats: { born: 0, died: 0, buried: 0, decomposed: 0, raids: 0, repelled: 0, foodIn: 0, fed: 0, eggs: 0 },
};
let uid = 0;

class Ant {
  constructor(loc, age = 0, opts = {}) {
    this.id = uid++; this.loc = loc; const p = locPt(loc); this.x = p.x; this.y = p.y;
    this.path = []; this.f = Math.random() < .5 ? -1 : 1; this.tilt = 0; this.tiltT = 0;
    this.ph = rand(0, 6); this.age = age; this.life = opts.life || rand(220, 440);
    this.job = null; this.carry = null; this.speed = opts.speed || rand(70, 88);
    this.mode = null; this.target = null; this.hop = 0; this.anim = null; this.moving = false;
    this.red = !!opts.red; this.repathT = 0; this.jit = 0;
  }
  move(dt, mult = 1) {
    let rem = this.speed * mult * dt * (this.carry ? 0.88 : 1);
    this.moving = this.path.length > 0;
    while (rem > 0 && this.path.length) {
      const t = this.path[0], dx = t.x - this.x, dy = t.y - this.y, d = Math.hypot(dx, dy);
      if (d > 0.01) { if (Math.abs(dx) > 0.25) this.f = dx > 0 ? 1 : -1; this.tiltT = Math.atan2(dy, Math.abs(dx)); }
      if (d <= rem) { this.x = t.x; this.y = t.y; this.loc = t.loc; this.path.shift(); rem -= d; }
      else { this.x += dx / d * rem; this.y += dy / d * rem; rem = 0; }
    }
    if (this.moving) this.ph += dt * this.speed * mult * 0.42;
  }
  moveDirect(tx, ty, dt, mult) {
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy), s = Math.min(d, this.speed * mult * dt);
    if (d > 0.5) { this.x += dx / d * s; this.y += dy / d * s; if (Math.abs(dx) > 0.25) this.f = dx > 0 ? 1 : -1; this.tiltT = Math.atan2(dy, Math.abs(dx)); this.ph += dt * this.speed * mult * 0.42; this.moving = true; }
  }
  runJob(dt) {
    const j = this.job;
    if (j && j.i == null) j.i = 0;
    while (j && this.job === j && j.i < j.steps.length) {
      const s = j.steps[j.i];
      if (s.t === 'go') {
        if (!s.started) { s.started = true; this.path = buildPath(this.loc, s.dest()); }
        if (this.path.length) { this.move(dt); return; }
        j.i++; continue;
      }
      if (s.t === 'wait') {
        this.moving = false;
        if (s.left == null) s.left = s.d;
        s.left -= dt; this.anim = s.anim || null;
        if (s.left > 0) return;
        this.anim = null; j.i++; continue;
      }
      if (s.t === 'do') { if (s.f() === false) { this.abort(); return; } j.i++; continue; }
    }
    if (this.job === j) { this.job = null; this.moving = false; }
  }
  abort() { const j = this.job; this.job = null; this.path = []; this.anim = null; this.moving = false; if (j && j.abort) j.abort(); }
  get interruptible() { return !this.carry && (!this.job || this.job.idle) && !this.mode; }
}

// ---- Jobs ----------------------------------------------------------------
const go = dest => ({ t: 'go', dest: typeof dest === 'function' ? dest : () => dest });
const wait = (d, anim) => ({ t: 'wait', d, anim });
const doo = f => ({ t: 'do', f });

function idleJob(a) {
  const r = Math.random(); let dest, anim = 'groom';
  if (a.age < 30 || r < 0.35) { dest = { node: 'N', u: rand(-0.78, 0.72) }; anim = 'tend'; }
  else if (r < 0.55) dest = { node: 'F', u: rand(0.05, 0.75) };
  else if (r < 0.7) dest = { node: 'Q', u: rand(0.5, 0.85) };
  else if (r < 0.85) dest = { node: 'E', sx: clamp(rand(450, 1250), visL + 40, Math.min(1330, visR - 40)) };
  else dest = { node: pick(['A', 'B', 'C']) };
  return { idle: true, steps: [go(dest), wait(rand(1.5, 4), anim)] };
}
function forageJob(a, item) {
  item.claims++;
  let released = false; const rel = () => { if (!released) { released = true; item.claims--; } };
  return {
    steps: [
      go(() => ({ node: 'E', sx: item.x + rand(-4, 4) })),
      wait(0.8, 'nibble'),
      doo(() => { rel(); if (item.bites <= 0) return false; item.bites--; a.carry = { kind: 'food', type: item.type }; if (item.bites <= 0) S.food.splice(S.food.indexOf(item), 1); }),
      go(() => ({ node: 'F', u: rand(0.2, 0.5) })),
      wait(0.5),
      doo(() => { S.store.push(a.carry.type); S.stats.foodIn++; a.carry = null; sparkle(a.x + a.f * 18, a.y, 3); }),
    ], abort: rel,
  };
}
function feedLarvaJob(a, larva) {
  larva.claimed = true; const rel = () => { larva.claimed = false; };
  return {
    steps: [
      go(() => ({ node: 'F', u: rand(0.08, 0.28) })),
      doo(() => { if (!S.store.length) return false; a.carry = { kind: 'food', type: S.store.pop() }; }),
      go(() => ({ node: 'N', u: slotU(larva.slot) + 0.09 })),
      doo(() => { a.f = -1; }),
      wait(1.6, 'feed'),
      doo(() => { larva.fed++; larva.since = 0; a.carry = null; rel(); S.stats.fed++; hearts(larva.x, larva.y - 14, 3); }),
    ], abort: () => { rel(); if (a.carry) { S.store.push(a.carry.type); a.carry = null; } },
  };
}
function feedQueenJob(a) {
  const q = S.queen; q.claimed = true; const rel = () => { q.claimed = false; };
  return {
    steps: [
      go(() => ({ node: 'F', u: rand(0.08, 0.28) })),
      doo(() => { if (!S.store.length) return false; a.carry = { kind: 'food', type: S.store.pop() }; }),
      go(() => ({ node: 'Q', u: q.u + 0.42 })),
      doo(() => { a.f = -1; }),
      wait(2, 'feed'),
      doo(() => { q.hunger = 0; a.carry = null; rel(); const p = floorPt(CH.Q, q.u + 0.25, 50); hearts(p.x, p.y, 5); }),
    ], abort: () => { rel(); if (a.carry) { S.store.push(a.carry.type); a.carry = null; } },
  };
}
function eggJob(a, egg) {
  egg.claimed = true; let slot = -1;
  return {
    steps: [
      go(() => ({ node: 'Q', u: qEggU(egg.slot) + 0.1 })),
      doo(() => { a.f = -1; slot = freeNurserySlot(); if (slot < 0) return false; egg.where = 'carried'; egg.slot = -1; a.carry = { kind: 'egg', b: egg }; nurseryTaken[slot] = egg; }),
      go(() => ({ node: 'N', u: slotU(slot) + 0.09 })),
      doo(() => { a.f = -1; }),
      wait(0.6, 'feed'),
      doo(() => { egg.where = 'nursery'; egg.slot = slot; egg.t = 0; egg.claimed = false; a.carry = null; sparkle(egg.x, egg.y, 3); }),
    ], abort: () => { egg.claimed = false; },
  };
}
function buryJob(a, c) {
  c.claimed = true;
  return {
    steps: [
      go(() => c.loc),
      wait(0.6, 'nibble'),
      doo(() => { c.state = 'carried'; a.carry = { kind: 'corpse', c }; }),
      go(() => ({ node: 'E', sx: rand(1375, 1525) })),
      wait(0.5),
      doo(() => { c.state = 'grave'; c.x = a.x + a.f * 24; c.y = SURF - 5; c.decay = 0; a.carry = null; S.stats.buried++; }),
    ], abort: () => { c.claimed = false; },
  };
}
const nurseryTaken = new Array(NURSERY_SLOTS).fill(null);
function freeNurserySlot() { const free = []; for (let i = 0; i < NURSERY_SLOTS; i++) if (!nurseryTaken[i]) free.push(i); return free.length ? pick(free) : -1; }

function chooseJob(a) {
  const q = S.queen, grown = a.age > 35;
  const corpse = S.corpses.find(c => c.state === 'lying' && !c.claimed);
  if (corpse && grown && Math.random() < 0.7) return buryJob(a, corpse);
  const egg = S.brood.find(b => b.where === 'queen' && !b.claimed);
  if (egg && Math.random() < 0.75 && freeNurserySlot() >= 0) return eggJob(a, egg);
  if (S.store.length && q.hunger > 1 && !q.claimed && Math.random() < 0.8) return feedQueenJob(a);
  const hungry = S.brood.filter(b => b.stage === 'larva' && b.where === 'nursery' && b.hungry && !b.claimed);
  if (hungry.length && S.store.length && Math.random() < 0.8) return feedLarvaJob(a, pick(hungry));
  if (grown && S.store.length < STORE_CAP - 4) {

// ---- Lifecycle -----------------------------------------------------------
function placeQueenEgg() {
  const used = new Set(S.brood.filter(b => b.where === 'queen').map(b => b.slot));
  for (let i = 0; i < 5; i++) if (!used.has(i)) return i;
  return -1;
}
function updateQueen(dt) {

      S.brood.push({ id: uid++, stage: 'egg', where: 'queen', slot, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: rand(0, 6) });
      q.pulse = 0.8; S.stats.eggs++;

}
function updateBrood(dt) {

    if (b.where !== 'nursery') continue;

    b.t += dt; b.since += dt;

    else if (b.stage === 'larva') {

}
function updateFood(dt) {

      const type = pick(Object.keys(FOOD)), bites = 2 + Math.floor(Math.random() * 5);

}

    const side = Math.random() < 0.5 ? -1 : 1;

      r.side = side; r.f = -side; r.fightT = null; r.fleeing = false;

    const x = lerp(visL - 60, visR + 60, t), y = SURF - 30 - Math.sin(t * Math.PI) * (SURF - 30 - Math.max(visT, -400) + 10) * 0.85;
    const rg = g.createRadialGradient(x, y, r * 0.5, x, y, r * 3);
    rg.addColorStop(0, glow); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r * 3, 0, 7); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    return { x, y };
  };
  if (p < 0.64) arc((p + 0.04) / 0.68, '#ffe14d', 34, 'rgba(255,230,120,0.5)');
  if (p > 0.6) { const m = arc((p - 0.6) / 0.42, '#f4f1e1', 26, 'rgba(220,230,255,0.35)'); g.fillStyle = 'rgba(180,180,170,0.35)'; g.beginPath(); g.arc(m.x - 8, m.y - 5, 5, 0, 7); g.arc(m.x + 7, m.y + 6, 3.5, 0, 7); g.fill(); }
  // clouds
  g.fillStyle = `rgba(255,255,255,${0.9 - night * 0.65})`;
  for (const c of clouds) {
    g.save(); g.translate(c.x, c.y); g.scale(c.s, c.s); g.beginPath();
    g.arc(0, 0, 26, 0, 7); g.arc(30, -10, 32, 0, 7); g.arc(62, 0, 24, 0, 7); g.arc(30, 10, 26, 0, 7); g.fill(); g.restore();
  }
  // ground layer
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(bg, 0, 0);
  worldT();
  // chamber contents ---------------------------------------------------
  // food store pile
  {
    const c = CH.F, cx = c.cx - 0.25 * c.rx; let i = 0;
    for (let r = 0; i < S.store.length; r++) {
      const n = 13 - 2 * r; if (n <= 0) break;
      for (let k = 0; k < n && i < S.store.length; k++, i++) {
        const x = cx + (k - (n - 1) / 2) * 14;
        drawFoodBit(S.store[i], x, floorY(c, cx) - 8 - r * 11 + Math.abs(x - cx) * 0.06, 7, (i * 1.7) % 3);
      }
    }
  }
  // nursery & queen's eggs
  for (const b of S.brood) {
    if (b.where === 'carried') continue;
    if (b.stage === 'egg') drawEgg(b.x, b.y - 3.5, 1.8);
    else if (b.stage === 'larva') drawLarva(b);
    else drawPupa(b);
  }
  // queen
  {
    const q = S.queen, qp = floorPt(CH.Q, q.u, 11 * 1.85);
    drawAnt(qp.x, qp.y, { f: 1, s: 3.3, col: '#2a1f1a', farCol: '#5a4a40', queen: true, pulse: q.pulse, ph: S.t * 0.6, moving: false, anim: 'groom' });
    if (q.hunger > 1) { // hungry bubble
      const bx = qp.x + 52, by = qp.y - 58 + Math.sin(S.t * 2.5) * 2;
      g.fillStyle = 'rgba(255,255,255,0.88)'; g.beginPath(); g.arc(qp.x + 38, qp.y - 38, 3, 0, 7); g.fill();
      g.beginPath(); g.arc(bx, by, 12, 0, 7); g.fill(); drawFoodBit('berry', bx, by, 5.5);
    }
  }
  // corpses
  for (const c of S.corpses) {
    if (c.state === 'carried') continue;
    if (c.state === 'lying') drawAnt(c.x, c.y, { f: c.f, s: AS, col: '#2a2a2e', dead: true });
    else {
      const d = c.decay, s = AS * (1 - d * 0.35);
      drawAnt(c.x, c.y + d * 5, { f: c.f, s, col: mix('#2a2a2e', '#7a5a3c', Math.min(1, d * 1.3)), dead: true, alpha: Math.max(0, 1 - d * d) });
    }
  }
  // grass + flowers
  g.lineCap = 'round'; g.lineWidth = 2.1;
  for (let c = 0; c < 4; c++) {
    g.strokeStyle = BLADE_COL[c]; g.beginPath();
    for (const b of blades) {
      if (b.c !== c || b.x < visL - 20 || b.x > visR + 20) continue;
      const sway = Math.sin(S.t * 1.4 + b.ph + b.x * 0.01) * 2.5 + b.lean;
      g.moveTo(b.x, SURF + 2); g.quadraticCurveTo(b.x + sway * 0.25, SURF - b.h * 0.5, b.x + sway, SURF - b.h);
    }
    g.stroke();
  }
  for (const f of flowers) {
    const sway = Math.sin(S.t * 1.1 + f.x) * 3, tx = f.x + sway, ty = SURF - f.h;
    g.strokeStyle = '#3f8f35'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(f.x, SURF + 2); g.quadraticCurveTo(f.x, SURF - f.h * 0.5, tx, ty); g.stroke();
    g.fillStyle = '#4fa843'; g.beginPath(); g.ellipse(f.x + 6, SURF - f.h * 0.35, 6, 2.5, -0.5, 0, 7); g.fill();
    g.fillStyle = f.c;
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + S.t * 0.1; g.beginPath(); g.ellipse(tx + Math.cos(a) * 6, ty + Math.sin(a) * 6, 4.5, 3, a, 0, 7); g.fill(); }
    g.fillStyle = '#f2a516'; g.beginPath(); g.arc(tx, ty, 3.6, 0, 7); g.fill();
  }
  // surface food
  for (const f of S.food) {
    const r = 6 + Math.sqrt(f.bites) * 5, appear = Math.min(1, (S.t - f.born) * 2);
    drawFoodBit(f.type, f.x, SURF - r * 0.7 * appear + 1, r * appear, f.rot);
  }
  // ants
  for (const a of S.ants) antDraw(a);
  for (const r of S.invaders) antDraw(r);
  // particles
  for (const p of S.parts) {
    if (p.age < 0) continue;
    const t = p.age / p.life, al = 1 - t * t;
    g.globalAlpha = al;
    if (p.k === 'heart') { g.fillStyle = '#ff5c8a'; drawHeart(p.x, p.y, p.s * 1.1); }
    else if (p.k === 'spark') { g.fillStyle = '#fff6b0'; drawStar(p.x, p.y, p.s * 0.6 * (1 - t * 0.5), S.t * 3); }
    else if (p.k === 'star') { g.fillStyle = '#ffd84a'; drawStar(p.x, p.y, p.s * 0.9, p.r + S.t * 6); }
    else if (p.k === 'puff') { g.fillStyle = 'rgba(210,180,140,0.7)'; g.beginPath(); g.arc(p.x, p.y, (3 + t * 7) * p.s, 0, 7); g.fill(); }
  }
  g.globalAlpha = 1;
}

// ---- Initial colony --------------------------------------------------------
function init() {
  for (let i = 0; i < 20; i++) {
    const r = Math.random();
    const loc = r < 0.3 ? { node: 'N', u: rand(-0.7, 0.7) } : r < 0.5 ? { node: 'F', u: rand(0, 0.7) } : r < 0.7 ? { node: 'Q', u: rand(0.5, 0.85) } : r < 0.9 ? { node: 'E', sx: rand(500, 1200) } : { node: pick(['A', 'B', 'C']) };
    const life = rand(220, 440);
    const a = new Ant(loc, rand(40, life - 30), { life }); a.idleT = rand(0, 2.5); S.ants.push(a);
  }
  for (let i = 0; i < 14; i++) S.store.push(pick(Object.keys(FOOD)));
  const mk = (stage, slot, extra) => { const b = { id: uid++, stage, where: 'nursery', slot, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: rand(0, 6), ...extra }; nurseryTaken[slot] = b; S.brood.push(b); };
  mk('egg', 0, { t: 6 }); mk('larva', 2, { fed: 1, since: 5 }); mk('larva', 4, { fed: 2, since: 2 });
  mk('larva', 6, { since: 6 }); mk('pupa', 8, { t: 4 }); mk('pupa', 10, { t: 12, fed: 3 });
  S.brood.push({ id: uid++, stage: 'egg', where: 'queen', slot: 0, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: 0 });
  for (let i = 0; i < 3; i++) { S.nextFood = 0; updateFood(0); }
  S.nextFood = 3;
}

// ---- Main loop -----------------------------------------------------------
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000) * SPEED; last = now;
  while (dt > 0) { const h = Math.min(dt, 1 / 30); update(h); dt -= h; }
  render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); init();
window.__sim = { S, update, render, N, CH };
requestAnimationFrame(frame);
</script>
