<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6ec3f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ant Colony</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#4a2e1a}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #ui{position:fixed;top:12px;right:12px;display:flex;gap:10px;z-index:2;transform-origin:100% 0}
  #ui.rot{top:auto;bottom:12px;flex-direction:column}
  #ui.rot svg{transform:rotate(90deg)}
  #ui button{width:44px;height:44px;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:rgba(20,14,10,.42);color:#fff;display:grid;place-items:center;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .2s,transform .1s}
  #ui button:hover{background:rgba(20,14,10,.62)}
  #ui button:active{transform:scale(.92)}
  #ui button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
  #ui svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #ui [hidden],#hint[hidden]{display:none}
  #hint{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2;border:0;cursor:pointer;
    font:600 18px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#3a2412;background:#fff6d6;
    padding:12px 20px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.3);animation:hint 2s ease-in-out infinite}
  #hint.rot{left:auto;right:0;top:50%;transform:translate(calc(50% - 36px),-50%) rotate(90deg);animation:none}
  @keyframes hint{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
  @media (prefers-reduced-motion:reduce){#hint{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="hint" type="button" hidden>♪ Click for music</button>
<div id="ui">
  <button id="snd" type="button" aria-label="Sound on" title="Sound"></button>
  <button id="fs" type="button" aria-label="Full screen" title="Full screen" hidden></button>
</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Ant Colony: a no-controls, no-lose ant farm for small kids.
// World is 1600x1000 units; the surface is at y=SURF. Everything is vector-drawn.
// ---------------------------------------------------------------------------
const W = 1600, H = 1000, SURF = 250, VIEW_TOP = 105, VIEW_W = 1300, VIEW_CX = 925;
const params = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, Math.min(60, +params.get('speed') || 1));
const COARSE = matchMedia('(pointer: coarse)').matches;
const PHONE = params.has('phone') || (COARSE && Math.min(screen.width, screen.height) < 700);
const AS = PHONE ? 2.35 : 1.75;      // ant drawing scale
const K = AS / 1.75;                 // creature/food scale relative to desktop
const LIFT = 6 * AS;                 // ant body centre above the floor
// ---- Remote debug log --------------------------------------------------------
// Batches errors, warnings, notable events, anomaly checks and periodic state
// snapshots, and POSTs them as JSON to LOG_ENDPOINT (relative to the page) on the
// server hosting the game. If nothing is listening there, the requests just fail
// quietly. Turn it off with ?nolog. In the browser console,
// antsDebug.report('what happened') sends everything right away.
const LOG_ENDPOINT = 'api/log';
const DBG = (() => {
  const on = !params.has('nolog') && location.protocol.startsWith('http');
  const SID = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const BUILD = '__BUILD__';
  const MAX_ENTRIES = 300, MAX_SNAPS = 30, MAX_POSTS = 400, MAX_BODY = 48000;
  const entries = [], snaps = [];
  let unsent = 0, posts = 0, timer = 0, lastFlush = 0;
  const now = () => Math.round(performance.now());
  function safe(v, d = 0) {
    if (v === null || v === undefined) return v;
    if (typeof v === 'number') return Number.isFinite(v) ? +v.toPrecision(6) : String(v);
    if (typeof v === 'string') return v.length > 600 ? v.slice(0, 600) + '…' : v;
    if (typeof v === 'boolean') return v;
    if (v instanceof Error) return { name: v.name, message: v.message, stack: (v.stack || '').slice(0, 1500) };
    if (d > 4) return '…';
    if (Array.isArray(v)) return v.slice(0, 25).map(x => safe(x, d + 1));
    if (typeof v === 'object') { const o = {}; for (const k of Object.keys(v).slice(0, 40)) o[k] = safe(v[k], d + 1); return o; }
    return String(v);
  }
  function record(kind, msg, data) { // kind: log | info | warn | error | event | anomaly | stall
    if (!on) return;
    const m = safe(String(msg)), last = entries[entries.length - 1];
    if (last && last.kind === kind && last.msg === m) { last.count = (last.count || 1) + 1; last.lastAt = now(); return; }
    entries.push({ at: now(), simT: typeof S === 'object' ? +S.t.toFixed(1) : null, kind, msg: m, data: data === undefined ? undefined : safe(data) });
    if (entries.length > MAX_ENTRIES) entries.shift();
    unsent++;
    if (kind === 'error' || kind === 'anomaly' || kind === 'stall') schedule(2000);
  }
  function snapshot(state) { if (!on) return; snaps.push({ at: now(), ...safe(state) }); if (snaps.length > MAX_SNAPS) snaps.shift(); }
  function payload(reason) {
    const body = { sid: SID, build: BUILD, reason, ua: navigator.userAgent, url: location.pathname + location.search,
      screen: `${innerWidth}x${innerHeight}@${devicePixelRatio}`, uptimeMs: now(),
      entries: entries.slice(-Math.max(1, unsent)), snaps: snaps.slice(-6) };
    let json = JSON.stringify(body);
    while (json.length > MAX_BODY && body.entries.length > 5) { body.entries = body.entries.slice(Math.floor(body.entries.length / 2)); json = JSON.stringify(body); }
    return json;
  }
  function flush(reason = 'batch', beacon = false) {
    clearTimeout(timer); timer = 0;
    if (!on || posts >= MAX_POSTS || (!unsent && reason === 'batch')) return;
    posts++; lastFlush = performance.now();
    const json = payload(reason); unsent = 0;
    try {
      if (beacon && navigator.sendBeacon) navigator.sendBeacon(LOG_ENDPOINT, new Blob([json], { type: 'application/json' }));
      else fetch(LOG_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: json, keepalive: true }).catch(() => {});
    } catch (e) { /* logging must never break the game */ }
  }
  function schedule(ms) {
    if (timer) return;
    timer = setTimeout(() => flush('auto'), Math.max(ms, 5000 - (performance.now() - lastFlush)));
  }
  function init() {
    if (!on) return;
    for (const level of ['log', 'info', 'warn', 'error']) {
      const orig = console[level].bind(console);
      console[level] = (...args) => { orig(...args); try { record(level, args.map(a => typeof a === 'string' ? a : JSON.stringify(safe(a))).join(' ')); } catch (e) { /* ignore */ } };
    }
    addEventListener('error', e => record('error', e.message || 'error', { src: e.filename, line: e.lineno, col: e.colno, stack: e.error && e.error.stack }));
    addEventListener('unhandledrejection', e => record('error', 'unhandled rejection', { reason: safe(e.reason) }));
    addEventListener('pagehide', () => flush('pagehide', true));
    document.addEventListener('visibilitychange', () => { record('event', document.hidden ? 'hidden' : 'visible'); if (document.hidden) flush('hidden', true); });
    setInterval(() => { if (unsent) flush('batch'); }, 60000);
    window.antsDebug = { sid: SID, entries, snaps,
      report(note = '') { record('event', 'manual report', { note, state: debugState() }); flush('manual'); return `sent (session ${SID})`; } };
    console.info(`[ants] debug session ${SID}; logs go to ${LOG_ENDPOINT}; antsDebug.report('note') sends now`);
  }
  return { on, SID, record, snapshot, flush, init, event: (m, d) => record('event', m, d), anomaly: (m, d) => record('anomaly', m, d) };
})();
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function hx(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
const mixA = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (a, al = 1) => `rgba(${a.map(Math.round).join(',')},${al})`;
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Colony layout -------------------------------------------------------
// Chambers are ellipses; ants walk along the floor (the lower half of the ellipse).
// `door` is the floor position (-1..1) where the tunnel comes in.
const CH = {
  F1: { cx: 470, cy: 432, rx: 155, ry: 58, door: 0.92, kind: 'store' },
  F2: { cx: 1180, cy: 420, rx: 150, ry: 56, door: -0.92, kind: 'store' },
  N1: { cx: 1165, cy: 648, rx: 178, ry: 64, door: -0.92, kind: 'nest' },
  N2: { cx: 470, cy: 660, rx: 168, ry: 62, door: 0.92, kind: 'nest' },
  Q: { cx: 935, cy: 878, rx: 205, ry: 74, door: -0.92, kind: 'queen' },
};
for (const k in CH) CH[k].s = Math.sign(CH[k].door);
const STORES = ['F1', 'F2'], NESTS = ['N1', 'N2'];
function floorPt(ch, u, lift = 0) {
  return { x: ch.cx + u * ch.rx, y: ch.cy + ch.ry * Math.sqrt(Math.max(0, 1 - u * u)) - lift };
}
function floorY(ch, x) { const u = (x - ch.cx) / ch.rx; return ch.cy + ch.ry * Math.sqrt(Math.max(0, 1 - u * u)); }
const N = { E: { x: 800, y: SURF - LIFT }, A: { x: 812, y: 345 }, B: { x: 838, y: 560 }, C: { x: 792, y: 770 } };
for (const k in CH) N[k] = floorPt(CH[k], CH[k].door, LIFT);
const EDGES = [['E', 'A'], ['A', 'F1'], ['A', 'F2'], ['A', 'B'], ['B', 'N1'], ['B', 'N2'], ['B', 'C'], ['C', 'Q']];
const ADJ = {}; for (const k in N) ADJ[k] = [];
for (const [a, b] of EDGES) { ADJ[a].push(b); ADJ[b].push(a); }
function route(a, b) {
  const prev = { [a]: null }, q = [a];
  while (q.length) { const n = q.shift(); if (n === b) break; for (const m of ADJ[n]) if (!(m in prev)) { prev[m] = n; q.push(m); } }
  const r = []; for (let n = b; n != null; n = prev[n]) r.unshift(n); return r;
}
// A "loc" is where an ant can stand: {node:'F1',u} on a chamber floor, {node:'E',sx} on
// the surface, or {node:'A'} at a tunnel bend.
function locPt(loc) {
  if (loc.u != null) return floorPt(CH[loc.node], loc.u, LIFT);
  if (loc.sx != null) return { x: loc.sx, y: SURF - LIFT };
  return N[loc.node];
}
function nodeLoc(id) { return CH[id] ? { node: id, u: CH[id].door } : id === 'E' ? { node: 'E', sx: N.E.x } : { node: id }; }
const P = loc => ({ ...locPt(loc), loc });
function floorSeg(id, u0, u1) {
  const pts = [], n = Math.max(1, Math.ceil(Math.abs(u1 - u0) / 0.1));
  for (let i = 1; i <= n; i++) pts.push(P({ node: id, u: lerp(u0, u1, i / n) }));
  return pts;
}
function buildPath(loc, dest) {
  const pts = [P(loc)];
  if (loc.node === dest.node) {
    if (CH[loc.node]) return pts.concat(floorSeg(loc.node, loc.u, dest.u));
    pts.push(P(dest)); return pts;
  }
  if (CH[loc.node]) pts.push(...floorSeg(loc.node, loc.u, CH[loc.node].door));
  else if (loc.node === 'E') pts.push(P(nodeLoc('E')));
  const r = route(loc.node, dest.node);
  for (let i = 1; i < r.length; i++) pts.push(P(nodeLoc(r[i])));
  if (CH[dest.node]) pts.push(...floorSeg(dest.node, CH[dest.node].door, dest.u));
  else if (dest.node === 'E') pts.push(P(dest));
  return pts;
}

// ---- Canvas / view -------------------------------------------------------
// On touch devices held in portrait we draw the scene rotated, so it is always
// landscape: turn the phone sideways and it fills the screen.
const cv = document.getElementById('c'), g = cv.getContext('2d');
let ROT = false, cw, chh, dpr, scale, offX, offY, visL, visR, visT, visB, bg;
function setT(ctx, a, b, c, d, e, f) {
  if (!ROT) ctx.setTransform(a * dpr, b * dpr, c * dpr, d * dpr, e * dpr, f * dpr);
  else ctx.setTransform(-b * dpr, a * dpr, -d * dpr, c * dpr, (chh - f) * dpr, e * dpr);
}
const screenT = ctx => setT(ctx, 1, 0, 0, 1, 0, 0);
const worldT = ctx => setT(ctx, scale, 0, 0, scale, offX, offY);
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w0 = innerWidth, h0 = innerHeight;
  ROT = COARSE && h0 > w0;
  document.getElementById('ui').classList.toggle('rot', ROT);
  document.getElementById('hint').classList.toggle('rot', ROT);
  cw = ROT ? h0 : w0; chh = ROT ? w0 : h0;
  cv.width = Math.round(w0 * dpr); cv.height = Math.round(h0 * dpr);
  scale = Math.min(chh / (H - VIEW_TOP), cw / VIEW_W);
  offX = cw / 2 - VIEW_CX * scale;
  offY = -VIEW_TOP * scale + (chh - (H - VIEW_TOP) * scale) * 0.15;
  visL = -offX / scale; visR = (cw - offX) / scale; visT = -offY / scale; visB = (chh - offY) / scale;
  buildBg();
}

// Static ground layer: dirt, pebbles, roots, then tunnels/chambers carved in.
function buildBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'), R = mulberry(7);
  worldT(b);
  const L = visL - 20, Rr = visR + 20, B = visB + 20;
  const gr = b.createLinearGradient(0, SURF, 0, H);
  gr.addColorStop(0, '#9a6638'); gr.addColorStop(0.35, '#7d5030'); gr.addColorStop(1, '#4f3120');
  b.fillStyle = gr; b.fillRect(L, SURF, Rr - L, B - SURF);
  for (let i = 0; i < 8; i++) { // soft strata
    const y = SURF + 70 + i * 105 + R() * 40;
    b.fillStyle = `rgba(${R() < .5 ? '60,35,18' : '150,105,65'},0.10)`;
    b.beginPath(); b.moveTo(L, y);
    for (let x = L; x <= Rr; x += 80) b.lineTo(x, y + Math.sin(x * 0.006 + i) * 12);
    b.lineTo(Rr, y + 40); b.lineTo(L, y + 40); b.fill();
  }
  b.lineCap = 'round';
  for (let i = 0; i < 26; i++) { // roots hanging from the grass
    let x = L + R() * (Rr - L), y = SURF + 4; if (Math.abs(x - 800) < 60) continue;
    b.strokeStyle = `rgba(${200 + R() * 30 | 0},${170 + R() * 30 | 0},${120 + R() * 30 | 0},0.55)`;
    b.lineWidth = 1.2 + R() * 1.5;
    b.beginPath(); b.moveTo(x, y);
    const len = 20 + R() * 45;
    for (let s = 0; s < len; s += 6) { x += (R() - 0.5) * 6; y += 6; b.lineTo(x, y); }
    b.stroke();
  }
  for (let i = 0; i < 300; i++) { // pebbles
    const x = L + R() * (Rr - L), y = SURF + 14 + R() * (B - SURF);
    const r = 1.5 + R() * R() * 9, c = 90 + R() * 70 | 0;
    b.fillStyle = `rgba(${c + 20},${c},${c - 15},${0.35 + R() * 0.4})`;
    b.beginPath(); b.ellipse(x, y, r * 1.3, r, R() * 3, 0, 7); b.fill();
  }
  const TW = 44 * K; // tunnel width
  const carve = (w, col) => {
    b.strokeStyle = col; b.fillStyle = col; b.lineWidth = w;
    for (const [p, q] of EDGES) {
      const a = N[p], c = N[q];
      b.beginPath(); b.moveTo(a.x, a.y + 4); b.lineTo(c.x, c.y + 4); b.stroke();
    }
    const pad = (w - TW) / 2;
    for (const k in CH) { const c = CH[k]; b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 14 + pad, c.ry + 14 + pad, 0, 0, 7); b.fill(); }
  };
  carve(TW + 12, '#5c3a22'); carve(TW, '#2e1e13');
  for (const k in CH) { // warm glow + floor rim
    const c = CH[k], rg = b.createRadialGradient(c.cx, c.cy + 20, 10, c.cx, c.cy, c.rx + 20);
    rg.addColorStop(0, 'rgba(255,190,110,0.16)'); rg.addColorStop(1, 'rgba(255,190,110,0)');
    b.fillStyle = rg; b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 14, c.ry + 14, 0, 0, 7); b.fill();
    b.strokeStyle = 'rgba(120,80,50,0.5)'; b.lineWidth = 3;
    b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 12, c.ry + 12, 0, 0.15, Math.PI - 0.15); b.stroke();
  }
  // top-soil band, graveyard patch, anthill mound
  b.fillStyle = '#6b4a2a'; b.fillRect(L, SURF - 1, Rr - L, 9);
  b.fillStyle = '#7a5a3c';
  b.beginPath(); b.ellipse(1450, SURF + 2, 110, 9, 0, 0, 7); b.fill();
  for (let i = 0; i < 34; i++) {
    b.fillStyle = `rgba(${150 + R() * 50 | 0},${130 + R() * 40 | 0},${100 + R() * 40 | 0},0.8)`;
    b.beginPath(); b.ellipse(1350 + R() * 200, SURF - 1 + R() * 6, 1.5 + R() * 2.5, 1.2 + R() * 1.6, 0, 0, 7); b.fill();
  }
  b.fillStyle = '#a06c3c';
  for (const s of [-1, 1]) { b.beginPath(); b.ellipse(800 + s * 40 * K, SURF + 1, 30 * K, 15 * K, 0, Math.PI, 0); b.fill(); }
  b.fillStyle = '#2e1e13'; b.beginPath(); b.ellipse(800, SURF + 2, 17 * K, 8 * K, 0, 0, 7); b.fill();
  for (let i = 0; i < 40; i++) {
    const a = R() * Math.PI, rr = (20 + R() * 40) * K;
    b.fillStyle = `rgba(${170 + R() * 40 | 0},${115 + R() * 30 | 0},${60 + R() * 30 | 0},0.9)`;
    b.beginPath(); b.arc(800 + Math.cos(a) * rr * (R() < .5 ? -1 : 1), SURF - Math.sin(a) * 8 * R(), 1 + R() * 1.6, 0, 7); b.fill();
  }
}

// ---- Scenery (sky, clouds, grass, flowers) ------------------------------
const SR = mulberry(42);
const stars = Array.from({ length: 90 }, () => ({ x: -900 + SR() * 3400, y: -1200 + SR() * (SURF + 1150), r: 0.6 + SR() * 1.4, p: SR() * 6 }));
const PUFFS = [[0, 0, 26], [30, -10, 32], [62, 0, 24], [30, 10, 26], [88, 4, 20]];
const clouds = Array.from({ length: 16 }, () => ({ x: SR() * 2600 - 500, y: 112 + SR() * 70, s: 0.45 + SR() * 0.5, v: 6 + SR() * 8 }));
const blades = [];
for (let x = -1400; x < 3000; x += 3.2 + SR() * 3) {
  if (Math.abs(x - 800) < 62 * K) continue;
  const grave = x > 1345 && x < 1555;
  blades.push({ x, h: (grave ? 5 : 10) + SR() * (grave ? 7 : 22), lean: (SR() - 0.5) * 8, ph: SR() * 6, c: SR() * 4 | 0 });
}
const BLADE_COL = ['#3f9a3a', '#55b246', '#2f7f30', '#6cc350'];
const flowers = [
  { x: 205, h: 54, c: '#ffd23f' }, { x: 380, h: 38, c: '#ff7aa8' }, { x: 610, h: 46, c: '#ffffff' },
  { x: 1020, h: 60, c: '#b07cff' }, { x: 1210, h: 40, c: '#ffd23f' }, { x: 1640, h: 50, c: '#ff7aa8' }, { x: -60, h: 44, c: '#ffffff' },
];
const SKY = [ // [phase, top, bottom]
  [0.00, '#6ec3f4', '#d5f1ff'], [0.52, '#6ec3f4', '#d5f1ff'], [0.60, '#5b5fa6', '#ffb27a'],
  [0.68, '#0d1838', '#2b3a6e'], [0.90, '#0d1838', '#2b3a6e'], [0.96, '#6a6fb8', '#ffc490'], [1.00, '#6ec3f4', '#d5f1ff'],
];
function skyAt(p) {
  for (let i = 1; i < SKY.length; i++) if (p <= SKY[i][0]) {
    const [p0, t0, b0] = SKY[i - 1], [p1, t1, b1] = SKY[i], t = (p - p0) / (p1 - p0 || 1);
    return [mixA(hx(t0), hx(t1), t), mixA(hx(b0), hx(b1), t)];
  }
  return [hx(SKY[0][1]), hx(SKY[0][2])];
}
const DAY_LEN = 300;
// ---- Weather -----------------------------------------------------------------
// Sunny -> cloudy -> rain -> thunderstorm and back. Each state has target levels for
// cloud cover, rain and storminess; the live levels drift towards them slowly, so
// each change takes roughly 5-12 seconds. In a thunderstorm the ants stay in,
// nobody forages, and red ants don't raid.
const WEATHER = {
  sunny: { cover: 0.28, rain: 0, storm: 0 },
  cloudy: { cover: 0.75, rain: 0, storm: 0 },
  rain: { cover: 0.92, rain: 0.6, storm: 0 },
  storm: { cover: 1, rain: 1, storm: 1 },
};
// The weather goes round this loop (about 3 minutes in all), so a few minutes of
// watching shows every kind. Each entry is [weather, min seconds, max seconds].
const CYCLE = [['sunny', 40, 60], ['cloudy', 20, 30], ['rain', 25, 35], ['storm', 35, 50], ['rain', 15, 25], ['cloudy', 15, 25]];
const startIdx = Math.max(0, CYCLE.findIndex(c => c[0] === params.get('weather')));
const Wx = { idx: startIdx, state: CYCLE[startIdx][0], left: rand(CYCLE[startIdx][1], CYCLE[startIdx][2]), cover: 0, rain: 0, storm: 0, wind: 0, drops: [], splashes: [], bolts: [], flash: 0, boltT: 3 };
Object.assign(Wx, (({ cover, rain, storm }) => ({ cover, rain, storm }))(WEATHER[Wx.state]));
const stormy = () => Wx.state === 'storm';
function setWeather(st) { // jump to a weather (also used by tests)
  const i = CYCLE.findIndex(c => c[0] === st);
  DBG.event('weather', { from: Wx.state, to: st });

// ---- Simulation state ----------------------------------------------------
const POP_CAP = 40, BROOD_CAP = 18, STORE_CAP = 36, NEST_SLOTS = 10;

const S = {

  stores: { F1: [], F2: [] },

// ---- Jobs ----------------------------------------------------------------
const go = dest => ({ t: 'go', dest: typeof dest === 'function' ? dest : () => dest });
const to = pt => ({ t: 'to', pt });

const doo = f => ({ t: 'do', f });

const storeDropU = id => CH[id].s * rand(0.35, 0.65);
// Every larva and the queen fancies one particular food (`want`), shown in their
// thought bubble, and changes their mind after each meal. Only that food makes them happy, so nurses fetch exactly that, foragers
// look out for foods that are wanted but running out, and the meadow sprouts more
// of whatever the colony is short of, so nobody waits forever.
const FOOD_TYPES = Object.keys(FOOD);
const has = (id, type) => type == null ? S.stores[id].length > 0 : S.stores[id].includes(type);

}

  if (S.queen.hunger > 0.6 && !stocked(S.queen.want)) w.add(S.queen.want);

}
const nestOf = loc => (loc && NESTS.includes(loc.node)) ? loc.node : pick(NESTS);

function idleJob(a) {
  const r = Math.random(); let dest, anim = 'groom';
  if (a.age < 30 || r < 0.35) { const n = pick(NESTS); dest = { node: n, u: rand(-0.75, 0.75) }; anim = 'tend'; }
  else if (r < 0.55) { const s = pick(STORES); dest = { node: s, u: storeDropU(s) }; }
  else if (r < 0.7) dest = { node: 'Q', u: QS * rand(0.45, 0.85) };

function shelterJob(a) { // storm: hurry inside and wait it out

        store = S.stores.F1.length === S.stores.F2.length ? pick(STORES) : S.stores.F1.length < S.stores.F2.length ? 'F1' : 'F2'; }),
      go(() => ({ node: store, u: storeDropU(store) })),

      doo(() => { q.hunger = 0; q.happy = 3; a.carry = null; rel(); const p = floorPt(CH.Q, q.u + QS * 0.25 * K, 50 * K); hearts(p.x, p.y, 6);

  if (q.hunger > 1 && !q.claimed && stocked(q.want) && Math.random() < 0.8) return feedQueenJob(a);

// ---- Particles -----------------------------------------------------------
function hearts(x, y, n) { for (let i = 0; i < n; i++) S.parts.push({ k: 'heart', x: x + rand(-6, 6), y, vx: rand(-8, 8), vy: rand(-28, -18), life: 1.6, age: -i * 0.18, s: rand(0.8, 1.2) }); }

function starBurst(x, y, n) { for (let i = 0; i < n; i++) { const a = rand(-Math.PI, 0); S.parts.push({ k: 'star', x, y, vx: Math.cos(a) * rand(20, 45), vy: Math.sin(a) * rand(20, 45), life: 0.9, age: 0, s: rand(0.7, 1.2), r: rand(0, 6) }); } }
function puff(x, y) { S.parts.push({ k: 'puff', x: x + rand(-8, 8), y: y + rand(-6, 4), vx: rand(-6, 6), vy: rand(-10, -2), life: 0.7, age: 0, s: rand(0.6, 1.2) }); }

// ---- Lifecycle -----------------------------------------------------------
function updateQueen(dt) {

    const pop = S.ants.length + S.brood.length;
    if (slot >= 0 && S.brood.length < BROOD_CAP && pop < POP_CAP) {
      S.brood.push({ id: uid++, stage: 'egg', where: 'queen', nest: null, slot, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: rand(0, 6), want: pick(FOOD_TYPES), happy: 0, refuse: 0 });

// Red ants walk in from the edge of the screen and head for a food store. Up to four

  starBurst(r.x, r.y - 20 * K, 8);

    }

// ---- Initial colony --------------------------------------------------------
function init() {

    const r = Math.random();
    const loc = r < 0.3 ? { node: pick(NESTS), u: rand(-0.7, 0.7) } : r < 0.5 ? (s => ({ node: s, u: storeDropU(s) }))(pick(STORES))
      : r < 0.62 ? { node: 'Q', u: QS * rand(0.45, 0.85) } : r < 0.88 ? { node: 'E', sx: rand(500, 1200) } : { node: pick(['A', 'B', 'C']) };
    const life = rand(220, 440);
    const a = new Ant(loc, rand(40, life - 30), { life }); a.idleT = rand(0, 2.5); S.ants.push(a);
  }
  for (const s of STORES) for (let i = 0; i < 10; i++) S.stores[s].push(pick(Object.keys(FOOD)));
  const mk = (nest, stage, slot, extra) => { const b = { id: uid++, stage, where: 'nursery', nest, slot, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: rand(0, 6), want: pick(FOOD_TYPES), happy: 0, refuse: 0, ...extra }; S.nest[nest][slot] = b; S.brood.push(b); };
  mk('N1', 'egg', 0, { t: 6 }); mk('N1', 'larva', 2, { fed: 1, since: 5 }); mk('N1', 'larva', 4, { fed: 2, since: 2 }); mk('N1', 'pupa', 7, { t: 4 });
  mk('N2', 'larva', 1, { since: 6 }); mk('N2', 'egg', 3, { t: 10 }); mk('N2', 'pupa', 6, { t: 12, fed: 3 });
  S.brood.push({ id: uid++, stage: 'egg', where: 'queen', nest: null, slot: 0, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: 0, want: pick(FOOD_TYPES), happy: 0, refuse: 0 });
  for (let i = 0; i < 3; i++) { S.nextFood = 0; updateFood(0); }
  S.nextFood = 3;
}

// ---- Sound -------------------------------------------------------------------
// Everything is synthesised with Web Audio: no sound files. There's rain, wind and
// thunder, plus a gentle tune that turns to a darker minor version of itself
// (slower, softer, lower) when it rains or storms. Browsers only allow audio after
// the person interacts with the page, so the first click/tap or key press turns
