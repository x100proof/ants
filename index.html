<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6ec3f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ant Colony</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#4a2e1a}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Ant Colony: a no-controls, no-lose ant farm for small kids.
// World is 1600x1000 units; the surface is at y=SURF. Everything is vector-drawn.
// ---------------------------------------------------------------------------
const W = 1600, H = 1000, SURF = 250, VIEW_TOP = 105, VIEW_W = 1300, VIEW_CX = 925;
const params = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, Math.min(60, +params.get('speed') || 1));
const COARSE = matchMedia('(pointer: coarse)').matches;
const PHONE = params.has('phone') || (COARSE && Math.min(screen.width, screen.height) < 700);
const AS = PHONE ? 2.35 : 1.75;      // ant drawing scale
const K = AS / 1.75;                 // creature/food scale relative to desktop
const LIFT = 6 * AS;                 // ant body centre above the floor
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function hx(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Colony layout -------------------------------------------------------
// Chambers are ellipses; ants walk along the floor (the lower half of the ellipse).
// `door` is the floor position (-1..1) where the tunnel comes in.
const CH = {
  F1: { cx: 470, cy: 432, rx: 155, ry: 58, door: 0.92, kind: 'store' },
  F2: { cx: 1180, cy: 420, rx: 150, ry: 56, door: -0.92, kind: 'store' },
  N1: { cx: 1165, cy: 648, rx: 178, ry: 64, door: -0.92, kind: 'nest' },
  N2: { cx: 470, cy: 660, rx: 168, ry: 62, door: 0.92, kind: 'nest' },
  Q: { cx: 935, cy: 878, rx: 205, ry: 74, door: -0.92, kind: 'queen' },
};
for (const k in CH) CH[k].s = Math.sign(CH[k].door);
const STORES = ['F1', 'F2'], NESTS = ['N1', 'N2'];
function floorPt(ch, u, lift = 0) {
  return { x: ch.cx + u * ch.rx, y: ch.cy + ch.ry * Math.sqrt(Math.max(0, 1 - u * u)) - lift };
}
function floorY(ch, x) { const u = (x - ch.cx) / ch.rx; return ch.cy + ch.ry * Math.sqrt(Math.max(0, 1 - u * u)); }
const N = { E: { x: 800, y: SURF - LIFT }, A: { x: 812, y: 345 }, B: { x: 838, y: 560 }, C: { x: 792, y: 770 } };
for (const k in CH) N[k] = floorPt(CH[k], CH[k].door, LIFT);
const EDGES = [['E', 'A'], ['A', 'F1'], ['A', 'F2'], ['A', 'B'], ['B', 'N1'], ['B', 'N2'], ['B', 'C'], ['C', 'Q']];
const ADJ = {}; for (const k in N) ADJ[k] = [];
for (const [a, b] of EDGES) { ADJ[a].push(b); ADJ[b].push(a); }
function route(a, b) {
  const prev = { [a]: null }, q = [a];
  while (q.length) { const n = q.shift(); if (n === b) break; for (const m of ADJ[n]) if (!(m in prev)) { prev[m] = n; q.push(m); } }
  const r = []; for (let n = b; n != null; n = prev[n]) r.unshift(n); return r;
}
// A "loc" is where an ant can stand: {node:'F1',u} on a chamber floor, {node:'E',sx} on
// the surface, or {node:'A'} at a tunnel bend.
function locPt(loc) {
  if (loc.u != null) return floorPt(CH[loc.node], loc.u, LIFT);
  if (loc.sx != null) return { x: loc.sx, y: SURF - LIFT };
  return N[loc.node];
}
function nodeLoc(id) { return CH[id] ? { node: id, u: CH[id].door } : id === 'E' ? { node: 'E', sx: N.E.x } : { node: id }; }
const P = loc => ({ ...locPt(loc), loc });
function floorSeg(id, u0, u1) {
  const pts = [], n = Math.max(1, Math.ceil(Math.abs(u1 - u0) / 0.1));
  for (let i = 1; i <= n; i++) pts.push(P({ node: id, u: lerp(u0, u1, i / n) }));
  return pts;
}
function buildPath(loc, dest) {
  const pts = [P(loc)];
  if (loc.node === dest.node) {
    if (CH[loc.node]) return pts.concat(floorSeg(loc.node, loc.u, dest.u));
    pts.push(P(dest)); return pts;
  }
  if (CH[loc.node]) pts.push(...floorSeg(loc.node, loc.u, CH[loc.node].door));
  else if (loc.node === 'E') pts.push(P(nodeLoc('E')));
  const r = route(loc.node, dest.node);
  for (let i = 1; i < r.length; i++) pts.push(P(nodeLoc(r[i])));
  if (CH[dest.node]) pts.push(...floorSeg(dest.node, CH[dest.node].door, dest.u));
  else if (dest.node === 'E') pts.push(P(dest));
  return pts;
}

// ---- Canvas / view -------------------------------------------------------
// On touch devices held in portrait we draw the scene rotated, so it is always
// landscape: turn the phone sideways and it fills the screen.
const cv = document.getElementById('c'), g = cv.getContext('2d');
let ROT = false, cw, chh, dpr, scale, offX, offY, visL, visR, visT, visB, bg;
function setT(ctx, a, b, c, d, e, f) {
  if (!ROT) ctx.setTransform(a * dpr, b * dpr, c * dpr, d * dpr, e * dpr, f * dpr);
  else ctx.setTransform(-b * dpr, a * dpr, -d * dpr, c * dpr, (chh - f) * dpr, e * dpr);
}
const screenT = ctx => setT(ctx, 1, 0, 0, 1, 0, 0);
const worldT = ctx => setT(ctx, scale, 0, 0, scale, offX, offY);
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w0 = innerWidth, h0 = innerHeight;
  ROT = COARSE && h0 > w0;
  cw = ROT ? h0 : w0; chh = ROT ? w0 : h0;
  cv.width = Math.round(w0 * dpr); cv.height = Math.round(h0 * dpr);
  scale = Math.min(chh / (H - VIEW_TOP), cw / VIEW_W);
  offX = cw / 2 - VIEW_CX * scale;
  offY = -VIEW_TOP * scale + (chh - (H - VIEW_TOP) * scale) * 0.15;
  visL = -offX / scale; visR = (cw - offX) / scale; visT = -offY / scale; visB = (chh - offY) / scale;
  buildBg();
}

// Static ground layer: dirt, pebbles, roots, then tunnels/chambers carved in.
function buildBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'), R = mulberry(7);
  worldT(b);
  const L = visL - 20, Rr = visR + 20, B = visB + 20;
  const gr = b.createLinearGradient(0, SURF, 0, H);
  gr.addColorStop(0, '#9a6638'); gr.addColorStop(0.35, '#7d5030'); gr.addColorStop(1, '#4f3120');
  b.fillStyle = gr; b.fillRect(L, SURF, Rr - L, B - SURF);
  for (let i = 0; i < 8; i++) { // soft strata
    const y = SURF + 70 + i * 105 + R() * 40;
    b.fillStyle = `rgba(${R() < .5 ? '60,35,18' : '150,105,65'},0.10)`;
    b.beginPath(); b.moveTo(L, y);
    for (let x = L; x <= Rr; x += 80) b.lineTo(x, y + Math.sin(x * 0.006 + i) * 12);
    b.lineTo(Rr, y + 40); b.lineTo(L, y + 40); b.fill();
  }
  b.lineCap = 'round';
  for (let i = 0; i < 26; i++) { // roots hanging from the grass
    let x = L + R() * (Rr - L), y = SURF + 4; if (Math.abs(x - 800) < 60) continue;
    b.strokeStyle = `rgba(${200 + R() * 30 | 0},${170 + R() * 30 | 0},${120 + R() * 30 | 0},0.55)`;
    b.lineWidth = 1.2 + R() * 1.5;
    b.beginPath(); b.moveTo(x, y);
    const len = 20 + R() * 45;
    for (let s = 0; s < len; s += 6) { x += (R() - 0.5) * 6; y += 6; b.lineTo(x, y); }
    b.stroke();
  }
  for (let i = 0; i < 300; i++) { // pebbles
    const x = L + R() * (Rr - L), y = SURF + 14 + R() * (B - SURF);
    const r = 1.5 + R() * R() * 9, c = 90 + R() * 70 | 0;
    b.fillStyle = `rgba(${c + 20},${c},${c - 15},${0.35 + R() * 0.4})`;
    b.beginPath(); b.ellipse(x, y, r * 1.3, r, R() * 3, 0, 7); b.fill();
  }
  const TW = 44 * K; // tunnel width
  const carve = (w, col) => {
    b.strokeStyle = col; b.fillStyle = col; b.lineWidth = w;
    for (const [p, q] of EDGES) {
      const a = N[p], c = N[q];
      b.beginPath(); b.moveTo(a.x, a.y + 4); b.lineTo(c.x, c.y + 4); b.stroke();
    }
    const pad = (w - TW) / 2;
    for (const k in CH) { const c = CH[k]; b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 14 + pad, c.ry + 14 + pad, 0, 0, 7); b.fill(); }
  };
  carve(TW + 12, '#5c3a22'); carve(TW, '#2e1e13');
  for (const k in CH) { // warm glow + floor rim
    const c = CH[k], rg = b.createRadialGradient(c.cx, c.cy + 20, 10, c.cx, c.cy, c.rx + 20);
    rg.addColorStop(0, 'rgba(255,190,110,0.16)'); rg.addColorStop(1, 'rgba(255,190,110,0)');
    b.fillStyle = rg; b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 14, c.ry + 14, 0, 0, 7); b.fill();
    b.strokeStyle = 'rgba(120,80,50,0.5)'; b.lineWidth = 3;
    b.beginPath(); b.ellipse(c.cx, c.cy, c.rx + 12, c.ry + 12, 0, 0.15, Math.PI - 0.15); b.stroke();
  }
  // top-soil band, graveyard patch, anthill mound
  b.fillStyle = '#6b4a2a'; b.fillRect(L, SURF - 1, Rr - L, 9);
  b.fillStyle = '#7a5a3c';
  b.beginPath(); b.ellipse(1450, SURF + 2, 110, 9, 0, 0, 7); b.fill();
  for (let i = 0; i < 34; i++) {
    b.fillStyle = `rgba(${150 + R() * 50 | 0},${130 + R() * 40 | 0},${100 + R() * 40 | 0},0.8)`;
    b.beginPath(); b.ellipse(1350 + R() * 200, SURF - 1 + R() * 6, 1.5 + R() * 2.5, 1.2 + R() * 1.6, 0, 0, 7); b.fill();
  }
  b.fillStyle = '#a06c3c';
  for (const s of [-1, 1]) { b.beginPath(); b.ellipse(800 + s * 40 * K, SURF + 1, 30 * K, 15 * K, 0, Math.PI, 0); b.fill(); }
  b.fillStyle = '#2e1e13'; b.beginPath(); b.ellipse(800, SURF + 2, 17 * K, 8 * K, 0, 0, 7); b.fill();
  for (let i = 0; i < 40; i++) {
    const a = R() * Math.PI, rr = (20 + R() * 40) * K;
    b.fillStyle = `rgba(${170 + R() * 40 | 0},${115 + R() * 30 | 0},${60 + R() * 30 | 0},0.9)`;
    b.beginPath(); b.arc(800 + Math.cos(a) * rr * (R() < .5 ? -1 : 1), SURF - Math.sin(a) * 8 * R(), 1 + R() * 1.6, 0, 7); b.fill();
  }
}

// ---- Scenery (sky, clouds, grass, flowers) ------------------------------
const SR = mulberry(42);
const stars = Array.from({ length: 90 }, () => ({ x: -900 + SR() * 3400, y: -1200 + SR() * (SURF + 1150), r: 0.6 + SR() * 1.4, p: SR() * 6 }));
const clouds = Array.from({ length: 6 }, () => ({ x: SR() * 2400 - 400, y: 120 + SR() * 60, s: 0.45 + SR() * 0.5, v: 6 + SR() * 8 }));
const blades = [];
for (let x = -1400; x < 3000; x += 3.2 + SR() * 3) {
  if (Math.abs(x - 800) < 62 * K) continue;
  const grave = x > 1345 && x < 1555;
  blades.push({ x, h: (grave ? 5 : 10) + SR() * (grave ? 7 : 22), lean: (SR() - 0.5) * 8, ph: SR() * 6, c: SR() * 4 | 0 });
}
const BLADE_COL = ['#3f9a3a', '#55b246', '#2f7f30', '#6cc350'];
const flowers = [
  { x: 205, h: 54, c: '#ffd23f' }, { x: 380, h: 38, c: '#ff7aa8' }, { x: 610, h: 46, c: '#ffffff' },
  { x: 1020, h: 60, c: '#b07cff' }, { x: 1210, h: 40, c: '#ffd23f' }, { x: 1640, h: 50, c: '#ff7aa8' }, { x: -60, h: 44, c: '#ffffff' },
];
const SKY = [ // [phase, top, bottom]
  [0.00, '#6ec3f4', '#d5f1ff'], [0.52, '#6ec3f4', '#d5f1ff'], [0.60, '#5b5fa6', '#ffb27a'],
  [0.68, '#0d1838', '#2b3a6e'], [0.90, '#0d1838', '#2b3a6e'], [0.96, '#6a6fb8', '#ffc490'], [1.00, '#6ec3f4', '#d5f1ff'],
];
function skyAt(p) {
  for (let i = 1; i < SKY.length; i++) if (p <= SKY[i][0]) {
    const [p0, t0, b0] = SKY[i - 1], [p1, t1, b1] = SKY[i], t = (p - p0) / (p1 - p0 || 1);
    return [mix(t0, t1, t), mix(b0, b1, t)];
  }
  return [SKY[0][1], SKY[0][2]];
}
const DAY_LEN = 300;
function nightness(p) { // 0 = full day, 1 = full night
  if (p < 0.52) return 0; if (p < 0.68) return (p - 0.52) / 0.16; if (p < 0.9) return 1; if (p < 1) return 1 - (p - 0.9) / 0.1; return 0;
}

// ---- Simulation state ----------------------------------------------------
const POP_CAP = 40, BROOD_CAP = 18, STORE_CAP = 36, NEST_SLOTS = 10;
const slotU = (nest, i) => CH[nest].s * (0.78 - i * 0.15);
const QS = CH.Q.s;                           // queen's door side; she faces the door
const qEggU = i => -QS * (0.9 - i * 0.075);  // egg pile at the far end, behind her
const FOOD = { seed: '#d9b46a', berry: '#d23a4e', crumb: '#f2d27c', leaf: '#6dbb4a', blue: '#5566d6' };
const BLACK_BITE = [7, 11], RED_BITE = [18, 26];
const S = {
  t: 0, day: 0.08,
  ants: [], invaders: [], corpses: [], brood: [], parts: [], food: [],
  stores: { F1: [], F2: [] },
  nest: { N1: new Array(NEST_SLOTS).fill(null), N2: new Array(NEST_SLOTS).fill(null) },
  queen: { u: -QS * 0.04, layT: 4, hunger: 0.5, claimed: false, pulse: 0 },
  nextFood: 2, nextRaid: 25,
  stats: { born: 0, died: 0, buried: 0, decomposed: 0, raids: 0, redKilled: 0, redBuried: 0, retreats: 0, bites: 0, foodIn: 0, fed: 0, eggs: 0 },
};
let uid = 0;
const storeTotal = () => S.stores.F1.length + S.stores.F2.length;

class Ant {
  constructor(loc, age = 0, opts = {}) {
    this.id = uid++; this.loc = loc; const p = locPt(loc); this.x = p.x; this.y = p.y;
    this.path = []; this.f = Math.random() < .5 ? -1 : 1; this.tilt = 0; this.tiltT = 0;
    this.ph = rand(0, 6); this.age = age; this.life = opts.life || rand(220, 440);
    this.job = null; this.carry = null; this.speed = (opts.speed || rand(70, 88)) * Math.sqrt(K);
    this.mode = null; this.target = null; this.hop = 0; this.anim = null; this.moving = false;
    this.red = !!opts.red; this.jit = 0; this.dir = { x: 1, y: 0 };
    this.hp = 100; this.biteT = rand(0.3, 1); this.lunge = 0; this.fighting = false;
  }
  move(dt, mult = 1) {
    let rem = this.speed * mult * dt * (this.carry ? 0.88 : 1);
    this.moving = this.path.length > 0;
    while (rem > 0 && this.path.length) {
      const t = this.path[0], dx = t.x - this.x, dy = t.y - this.y, d = Math.hypot(dx, dy);
      if (d > 0.01) { if (Math.abs(dx) > 0.25) this.f = dx > 0 ? 1 : -1; this.tiltT = Math.atan2(dy, Math.abs(dx)); this.dir = { x: dx / d, y: dy / d }; }
      if (d <= rem) { this.x = t.x; this.y = t.y; this.loc = t.loc; this.path.shift(); rem -= d; }
      else { this.x += dx / d * rem; this.y += dy / d * rem; rem = 0; }
    }
    if (this.moving) this.ph += dt * this.speed * mult * 0.42 / Math.sqrt(K);
  }
  moveDirect(tx, ty, dt, mult) {
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy), s = Math.min(d, this.speed * mult * dt);
    if (d > 0.5) {
      this.x += dx / d * s; this.y += dy / d * s;
      if (Math.abs(dx) > 0.25) this.f = dx > 0 ? 1 : -1; this.tiltT = Math.atan2(dy, Math.abs(dx));
      this.ph += dt * this.speed * mult * 0.42 / Math.sqrt(K); this.moving = true;
      return false;
    }
    this.moving = false; return true;
  }
  face(o) { const vx = o.x - this.x, vy = o.y - this.y; if (Math.abs(vx) > 0.5) this.f = vx > 0 ? 1 : -1; this.tiltT = Math.atan2(vy, Math.abs(vx) + 0.001); }
  runJob(dt) {
    const j = this.job;
    if (j && j.i == null) j.i = 0;
    while (j && this.job === j && j.i < j.steps.length) {
      const s = j.steps[j.i];
      if (s.t === 'go') {
        if (!s.started) { s.started = true; this.path = buildPath(this.loc, s.dest()); }
        if (this.path.length) { this.move(dt); return; }
        j.i++; continue;
      }
      if (s.t === 'to') { const p = s.pt(); if (!this.moveDirect(p.x, p.y, dt, 0.7)) return; j.i++; continue; }
      if (s.t === 'wait') {
        this.moving = false;
        if (s.left == null) s.left = s.d;
        s.left -= dt; this.anim = s.anim || null;
        if (s.left > 0) return;
        this.anim = null; j.i++; continue;
      }
      if (s.t === 'do') { if (s.f() === false) { this.abort(); return; } j.i++; continue; }
    }
    if (this.job === j) { this.job = null; this.moving = false; }
  }
  abort() { const j = this.job; this.job = null; this.path = []; this.anim = null; this.moving = false; if (j && j.abort) j.abort(); }
  get interruptible() { return !this.carry && (!this.job || this.job.idle) && !this.mode; }
}

// ---- Jobs ----------------------------------------------------------------
const go = dest => ({ t: 'go', dest: typeof dest === 'function' ? dest : () => dest });
const to = pt => ({ t: 'to', pt });
const wait = (d, anim) => ({ t: 'wait', d, anim });
const doo = f => ({ t: 'do', f });
const storeTakeU = id => CH[id].s * rand(0.25, 0.38);
const storeDropU = id => CH[id].s * rand(0.35, 0.65);
function takeStoreFor(near) { // nearest store that has food
  const order = near === 'N1' ? ['F2', 'F1'] : near === 'N2' ? ['F1', 'F2'] : STORES.slice().sort((a, b) => S.stores[b].length - S.stores[a].length);
  return order.find(id => S.stores[id].length) || null;
}
const nestOf = loc => (loc && NESTS.includes(loc.node)) ? loc.node : pick(NESTS);

function idleJob(a) {
  const r = Math.random(); let dest, anim = 'groom';
  if (a.age < 30 || r < 0.35) { const n = pick(NESTS); dest = { node: n, u: rand(-0.75, 0.75) }; anim = 'tend'; }
  else if (r < 0.55) { const s = pick(STORES); dest = { node: s, u: storeDropU(s) }; }
  else if (r < 0.7) dest = { node: 'Q', u: QS * rand(0.45, 0.85) };
  else if (r < 0.85) dest = { node: 'E', sx: clamp(rand(450, 1250), visL + 40, Math.min(1330, visR - 40)) };
  else dest = { node: pick(['A', 'B', 'C']) };
  return { idle: true, steps: [go(dest), wait(rand(1.5, 4), anim)] };
}
function restJob(a) { // a hurt ant goes home to rest and heal
  const n = pick(NESTS);
  return { steps: [go({ node: n, u: rand(-0.6, 0.6) }), wait(rand(5, 8), 'groom')] };
}
function forageJob(a, item) {
  item.claims++;
  let released = false, store = null; const rel = () => { if (!released) { released = true; item.claims--; } };
  return {
    steps: [
      go(() => ({ node: 'E', sx: item.x + rand(-4, 4) })),
      wait(0.8, 'nibble'),
      doo(() => { rel(); if (item.bites <= 0) return false; item.bites--; a.carry = { kind: 'food', type: item.type }; if (item.bites <= 0) S.food.splice(S.food.indexOf(item), 1);
        store = S.stores.F1.length === S.stores.F2.length ? pick(STORES) : S.stores.F1.length < S.stores.F2.length ? 'F1' : 'F2'; }),
      go(() => ({ node: store, u: storeDropU(store) })),
      wait(0.5),
      doo(() => { S.stores[store].push(a.carry.type); S.stats.foodIn++; a.carry = null; sparkle(a.x + a.f * 18 * K, a.y, 3); }),
    ], abort: rel,
  };
}
function fetchFood(a, near) { // steps: walk to a store and pick up one food item
  let store = null;
  return [
    doo(() => { store = takeStoreFor(near); if (!store) return false; }),
    go(() => ({ node: store, u: storeTakeU(store) })),
    doo(() => { if (!S.stores[store].length) return false; a.carry = { kind: 'food', type: S.stores[store].pop() }; }),
  ];
}

function chooseJob(a) {

  if (storeTotal() && q.hunger > 1 && !q.claimed && Math.random() < 0.8) return feedQueenJob(a);
  const hungry = S.brood.filter(b => b.stage === 'larva' && b.where === 'nursery' && b.hungry && !b.claimed);

// ---- Particles -----------------------------------------------------------
function hearts(x, y, n) { for (let i = 0; i < n; i++) S.parts.push({ k: 'heart', x: x + rand(-6, 6), y, vx: rand(-8, 8), vy: rand(-28, -18), life: 1.6, age: -i * 0.18, s: rand(0.8, 1.2) }); }
function sparkle(x, y, n) { for (let i = 0; i < n; i++) S.parts.push({ k: 'spark', x: x + rand(-8, 8), y: y + rand(-8, 4), vx: rand(-10, 10), vy: rand(-20, -5), life: 0.9, age: 0, s: rand(0.7, 1.3) }); }
function starBurst(x, y, n) { for (let i = 0; i < n; i++) { const a = rand(-Math.PI, 0); S.parts.push({ k: 'star', x, y, vx: Math.cos(a) * rand(20, 45), vy: Math.sin(a) * rand(20, 45), life: 0.9, age: 0, s: rand(0.7, 1.2), r: rand(0, 6) }); } }
function puff(x, y) { S.parts.push({ k: 'puff', x: x + rand(-8, 8), y: y + rand(-6, 4), vx: rand(-6, 6), vy: rand(-10, -2), life: 0.7, age: 0, s: rand(0.6, 1.2) }); }
function chomp(x, y) { S.parts.push({ k: 'chomp', x, y, vx: 0, vy: -12, life: 0.45, age: 0, s: 1 }); }

// ---- Lifecycle -----------------------------------------------------------
function updateQueen(dt) {
  const q = S.queen;
  q.hunger += dt / 28; q.pulse = Math.max(0, q.pulse - dt);
  q.layT -= dt;
  if (q.layT <= 0) {
    const used = new Set(S.brood.filter(b => b.where === 'queen').map(b => b.slot));
    let slot = -1; for (let i = 0; i < 5; i++) if (!used.has(i)) { slot = i; break; }
    const pop = S.ants.length + S.brood.length;
    if (slot >= 0 && S.brood.length < BROOD_CAP && pop < POP_CAP) {
      S.brood.push({ id: uid++, stage: 'egg', where: 'queen', nest: null, slot, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: rand(0, 6) });
      q.pulse = 0.8; S.stats.eggs++;
      const p = floorPt(CH.Q, qEggU(slot), 4); sparkle(p.x, p.y - 4, 4);
    }
    q.layT = S.ants.length < 14 ? rand(3, 5) : rand(6, 10);
  }
}
function updateBrood(dt) {

    const b = S.brood[i];
    if (b.where === 'queen') { const p = floorPt(CH.Q, qEggU(b.slot), 3); b.x = p.x; b.y = p.y - (b.slot % 2) * 5 * K; continue; }
    if (b.where !== 'nursery') continue;
    const p = floorPt(CH[b.nest], slotU(b.nest, b.slot), 4); b.x = p.x; b.y = p.y;
    b.t += dt; b.since += dt;
    if (b.stage === 'egg' && b.t > 16) { b.stage = 'larva'; b.t = 0; b.since = 4; sparkle(b.x, b.y, 2); }
    else if (b.stage === 'larva') {
      b.hungry = b.fed < 3 && b.since > 5;
      if (b.fed >= 3 && b.since > 6 && !b.claimed) { b.stage = 'pupa'; b.t = 0; b.hungry = false; }
    } else if (b.stage === 'pupa' && b.t > 18) {
      S.brood.splice(i, 1); S.nest[b.nest][b.slot] = null;
      const a = new Ant({ node: b.nest, u: slotU(b.nest, b.slot) }, 0);

}
function updateFood(dt) {
  S.nextFood -= dt;
  const night = nightness(S.day);
  if (S.nextFood <= 0) {
    S.nextFood = rand(4, 7) * (night > 0.5 ? 2.5 : 1);
    if (S.food.length < 6) {
      const lo = Math.max(60, visL + 50), hi = Math.min(1320, visR - 50);
      let x, tries = 0;
      do { x = rand(lo, hi); tries++; } while ((Math.abs(x - 800) < 90 || S.food.some(f => Math.abs(f.x - x) < 60)) && tries < 20);
      const type = pick(Object.keys(FOOD)), bites = 2 + Math.floor(Math.random() * 5);
      S.food.push({ x, type, bites, max: bites, claims: 0, born: S.t, rot: rand(-0.6, 0.6) });
    }
  }
}

// ---- Red raiders & fighting ------------------------------------------------
// Red ants walk in from the edge of the screen and head for a food store. Up to four
// black ants gang up on each one. Every bite takes some health: black bites are weaker,
// so it takes several black ants to beat one red ant. A black ant that gets badly hurt
// goes home to rest and heal (black ants never die in a fight). A defeated red ant is
// carried to the graveyard like any other.
function attackersOf(r) { return S.ants.filter(a => a.target === r); }
function spawnRaid() {
  const n = Math.random() < 0.55 ? 1 : Math.random() < 0.75 ? 2 : 3;
  const side = Math.random() < 0.5 ? -1 : 1;
  S.stats.raids++;
  for (let i = 0; i < n; i++) {
    const sx = side < 0 ? visL - 30 * K - i * 50 * K : visR + 30 * K + i * 50 * K;
    const r = new Ant({ node: 'E', sx }, 100, { red: true, speed: rand(58, 66) });
    r.side = side; r.f = -side; r.dir = { x: -side, y: 0 };
    const st = pick(STORES);

  }
}
function killRed(r) {
  S.invaders.splice(S.invaders.indexOf(r), 1); r.gone = true; S.stats.redKilled++;
  starBurst(r.x, r.y - 20 * K, 8);
  S.corpses.push({ id: r.id, red: true, x: r.x, y: r.y + 5 * K, f: r.f, loc: r.path.length ? r.path[0].loc : r.loc, state: 'lying', claimed: false, decay: 0 });
}
function updateRaids(dt) {

  for (const r of S.invaders.slice()) {
    r.lunge = Math.max(0, r.lunge - dt);
    const fighters = attackersOf(r).filter(a => a.fighting);
    if (fighters.length) {

      r.biteT -= dt;

        v.hp -= rand(...RED_BITE); S.stats.bites++;

        if (v.hp <= 25) retreat(v);
      }
    } else {
      r.move(dt);
    }
    // assign up to four defenders, nearest first
    let defs = attackersOf(r).length;
    while (defs < 4) {

}

    a.carry = null;

function updateAnts(dt) {

function update(dt) {

// ---- Drawing -------------------------------------------------------------
const ANT_BLACK = '#1d1b20', ANT_RED = '#c0341f';

}

  g.beginPath(); g.ellipse(-2.2, -0.6, 1.8, 1.5, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(1.5, -1.2, 4, 2.6, -0.15, 0, 7); g.fill();
  g.beginPath(); g.ellipse(7.8 + bob, -2.4, 3.5, 3.1, 0.1, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.20)'; // shine
  g.beginPath(); g.ellipse(ax + 1, -1.2 - ary * 0.5, arx * 0.5, ary * 0.25, -0.12, 0, 7); g.fill();
  if (!dead) { // cute eye
    g.fillStyle = '#fff'; g.beginPath(); g.arc(9 + bob, -3.3, 1.35, 0, 7); g.fill();
    g.fillStyle = '#111'; g.beginPath(); g.arc(9.45 + bob, -3.2, 0.7, 0, 7); g.fill();
  } else {
    g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(8.3, -4); g.lineTo(9.7, -2.6); g.moveTo(9.7, -4); g.lineTo(8.3, -2.6); g.stroke();
  }

  g.beginPath(); g.moveTo(9 + bob, -5); g.lineTo(10 + bob, dead ? 9.5 : -9.5); g.lineTo(14.5 + bob, -8 + wig); g.stroke();
  g.beginPath(); g.moveTo(8.4 + bob, -5); g.lineTo(8.6 + bob, -9.8); g.lineTo(13 + bob, -9.3 - wig * 0.7); g.stroke();
  g.lineWidth = o.red ? 1.4 : 1.1;

function drawCarry(c, x, y) {

  else if (c.kind === 'corpse') drawAnt(x + 9, y - 3, { f: 1, s: 0.8, col: c.c.red ? '#9a3020' : ANT_BLACK, dead: true, tilt: 0.25 });

function drawFoodBit(type, x, y, r, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = FOOD[type];
  if (type === 'leaf') {
    g.beginPath(); g.ellipse(0, 0, r * 1.5, r * 0.8, 0, 0, 7); g.fill();
    g.strokeStyle = 'rgba(30,90,30,0.7)'; g.lineWidth = Math.max(0.4, r * 0.12); g.beginPath(); g.moveTo(-r * 1.4, 0); g.lineTo(r * 1.4, 0); g.stroke();
  } else if (type === 'seed') {
    g.beginPath(); g.ellipse(0, 0, r * 1.25, r * 0.8, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(120,80,30,0.35)'; g.beginPath(); g.ellipse(r * 0.2, r * 0.15, r * 0.7, r * 0.3, 0, 0, 7); g.fill();
  } else if (type === 'crumb') {
    g.beginPath(); g.moveTo(-r, -r * 0.6); g.lineTo(r * 0.8, -r * 0.9); g.lineTo(r * 1.1, r * 0.6); g.lineTo(-r * 0.7, r * 0.9); g.closePath(); g.fill();
    g.fillStyle = 'rgba(190,130,50,0.5)'; g.beginPath(); g.arc(-r * 0.2, -r * 0.1, r * 0.25, 0, 7); g.fill();
  } else {
    g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  }
  if (type === 'berry' || type === 'blue') { g.fillStyle = 'rgba(255,255,255,0.45)'; g.beginPath(); g.arc(-r * 0.35, -r * 0.35, r * 0.28, 0, 7); g.fill(); }
  g.restore();
}
function drawEgg(x, y, s) {
  g.fillStyle = '#fbf6e8'; g.beginPath(); g.ellipse(x, y, 3.6 * s, 2.5 * s, 0.3, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(x - 1 * s, y - 0.9 * s, 0.8 * s, 0, 7); g.fill();
}
function drawLarva(b) {
  const sz = (0.9 + b.fed * 0.17) * 1.7 * K, w = Math.sin(S.t * (b.hungry ? 7 : 2) + b.wig) * (b.hungry ? 0.18 : 0.06);
  g.save(); g.translate(b.x, b.y - 4 * sz); g.scale(sz, sz); g.rotate(w);
  g.fillStyle = '#f6edd3'; g.strokeStyle = 'rgba(190,160,110,0.8)'; g.lineWidth = 0.6;
  for (let k = 0; k < 7; k++) { // curled C of segments
    const a = Math.PI * 0.15 + k * 0.38, r = 4.2 - k * 0.25;
    g.beginPath(); g.arc(Math.cos(a) * 4.5, -Math.sin(a) * 3.2 + 1, r * 0.75, 0, 7); g.fill(); g.stroke();
  }
  g.fillStyle = '#3a2a1a'; g.beginPath(); g.arc(4.5, 0.2, 0.55, 0, 7); g.fill();
  g.restore();
  if (b.hungry) { // thought bubble with a crumb
    const bx = b.x + 10 * K, by = b.y - 36 * K + Math.sin(S.t * 3 + b.wig) * 1.5;
    g.fillStyle = 'rgba(255,255,255,0.88)';
    g.beginPath(); g.arc(b.x + 4 * K, b.y - 20 * K, 2 * K, 0, 7); g.fill();
    g.beginPath(); g.arc(bx, by, 10 * K, 0, 7); g.fill();
    drawFoodBit('crumb', bx, by, 4.4 * K);
  }
}
function drawPupa(b) {
  g.save(); g.translate(b.x, b.y - 7 * K); g.scale(1.7 * K, 1.7 * K); g.rotate(-0.15 + Math.sin(S.t * 0.8 + b.wig) * 0.03);
  g.translate(b.t > 15 ? Math.sin(S.t * 30) * 0.6 : 0, 0);
  g.fillStyle = '#e8d4a6'; g.beginPath(); g.ellipse(0, 0, 7.5, 4, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(160,120,70,0.5)'; g.lineWidth = 0.6;
  for (let k = -2; k <= 2; k++) { g.beginPath(); g.ellipse(k * 2.4, 0, 0.6, 3.6, 0, 0, 7); g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,0.4)'; g.beginPath(); g.ellipse(-1, -2, 4, 1, 0, 0, 7); g.fill();
  g.restore();
}
function drawHeart(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 2.5); g.bezierCurveTo(-5, -1.5, -2.5, -5.5, 0, -2.5); g.bezierCurveTo(2.5, -5.5, 5, -1.5, 0, 2.5); g.fill();
  g.restore();
}
function drawStar(x, y, s, r) {
  g.save(); g.translate(x, y); g.rotate(r); g.scale(s, s); g.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? 1.6 : 4; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath(); g.fill(); g.restore();
}
function drawHealth(x, y, hp) {
  const w = 28 * K, h = 4.5 * K, f = clamp(hp / 100, 0, 1);
  g.fillStyle = 'rgba(20,12,6,0.75)';
  g.beginPath(); g.roundRect(x - w / 2 - 1.5, y - 1.5, w + 3, h + 3, 3); g.fill();
  g.fillStyle = f > 0.6 ? '#5fd35a' : f > 0.3 ? '#ffd23f' : '#ff5a4a';
  if (f > 0) { g.beginPath(); g.roundRect(x - w / 2, y, w * f, h, 2); g.fill(); }
}
function antColor(a) {
  if (a.red) return [ANT_RED, '#8f2a1a'];
  if (a.age < 60) { const t = a.age / 60; return [mix('#c08a55', ANT_BLACK, t), mix('#d6a473', '#4a4650', t)]; }
  return [ANT_BLACK, '#4a4650'];
}
function antDraw(a) {
  a.tilt += (a.tiltT - a.tilt) * 0.25;
  if (!a.moving && Math.abs(a.tiltT) > 0.01 && !(a.path && a.path.length) && !a.fighting) a.tiltT *= 0.9;
  const [col, far] = antColor(a);
  const inFight = a.fighting || (a.red && attackersOf(a).some(o => o.fighting));
  const jx = inFight ? Math.sin(a.jit * 40) * 1.2 * K : 0;
  const hopY = a.hop > 0 ? -Math.abs(Math.sin(a.hop * 15)) * 10 * K : 0;
  drawAnt(a.x + jx, a.y + hopY, { f: a.f, s: AS * (a.red ? 1.08 : 1), tilt: a.tilt, col, farCol: far, ph: a.ph, moving: a.moving, carry: a.carry, anim: a.anim, red: a.red, lunge: a.lunge });
  a.showHp = inFight || a.hp < 99.5;
}

function render() {
  const p = S.day, night = nightness(p), [top, bot] = skyAt(p);
  screenT(g);
  const surfScr = offY + SURF * scale;
  const sg = g.createLinearGradient(0, 0, 0, surfScr);
  sg.addColorStop(0, top); sg.addColorStop(1, bot);
  g.fillStyle = sg; g.fillRect(0, 0, cw, surfScr + 2);
  worldT(g);
  if (night > 0.05) { // stars
    g.fillStyle = '#fff';
    for (const s of stars) { if (s.y > SURF - 20 || s.y < visT - 5) continue; g.globalAlpha = night * (0.5 + 0.5 * Math.sin(S.t * 1.5 + s.p)); g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill(); }
    g.globalAlpha = 1;
  }
  const skyH = SURF - visT;
  const arc = (t, col, r, glow) => { // sun & moon on a low arc over the meadow
    const x = lerp(visL - 60, visR + 60, t), y = SURF - 25 - Math.sin(t * Math.PI) * Math.max(10, skyH - r - 40);
    const rg = g.createRadialGradient(x, y, r * 0.5, x, y, r * 3);
    rg.addColorStop(0, glow); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r * 3, 0, 7); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    return { x, y };
  };
  if (p < 0.64) arc((p + 0.04) / 0.68, '#ffe14d', 26, 'rgba(255,230,120,0.5)');
  if (p > 0.6) { const m = arc((p - 0.6) / 0.42, '#f4f1e1', 20, 'rgba(220,230,255,0.35)'); g.fillStyle = 'rgba(180,180,170,0.35)'; g.beginPath(); g.arc(m.x - 6, m.y - 4, 4, 0, 7); g.arc(m.x + 5, m.y + 5, 2.8, 0, 7); g.fill(); }
  g.fillStyle = `rgba(255,255,255,${0.9 - night * 0.65})`; // clouds
  for (const c of clouds) {
    const cy = Math.max(c.y, visT + 30 * c.s);
    g.save(); g.translate(c.x, cy); g.scale(c.s, c.s); g.beginPath();
    g.arc(0, 0, 26, 0, 7); g.arc(30, -10, 32, 0, 7); g.arc(62, 0, 24, 0, 7); g.arc(30, 10, 26, 0, 7); g.fill(); g.restore();
  }
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(bg, 0, 0); // ground layer
  worldT(g);
  for (const id of STORES) { // food piles
    const c = CH[id], st = S.stores[id], cx = c.cx - c.s * 0.3 * c.rx, sp = 14 * K; let i = 0;
    for (let r = 0; i < st.length; r++) {
      const n = 11 - 2 * r; if (n <= 0) break;
      for (let k = 0; k < n && i < st.length; k++, i++) {
        const x = cx + (k - (n - 1) / 2) * sp;
        drawFoodBit(st[i], x, floorY(c, cx) - 8 * K - r * 11 * K + Math.abs(x - cx) * 0.06, 7 * K, (i * 1.7) % 3);
      }
    }
  }
  for (const b of S.brood) { // eggs, larvae, cocoons
    if (b.where === 'carried') continue;
    if (b.stage === 'egg') drawEgg(b.x, b.y - 3.5 * K, 1.8 * K);
    else if (b.stage === 'larva') drawLarva(b);
    else drawPupa(b);
  }
  { // the queen
    const q = S.queen, qs = 3.3 * K, qp = floorPt(CH.Q, q.u, 6 * qs);
    drawAnt(qp.x, qp.y, { f: QS, s: qs, col: '#2a1f1a', farCol: '#5a4a40', queen: true, pulse: q.pulse, ph: S.t * 0.6, moving: false, anim: 'groom' });
    if (q.hunger > 1) {
      const bx = qp.x + QS * 52 * K, by = qp.y - 58 * K + Math.sin(S.t * 2.5) * 2;
      g.fillStyle = 'rgba(255,255,255,0.88)'; g.beginPath(); g.arc(qp.x + QS * 38 * K, qp.y - 38 * K, 3 * K, 0, 7); g.fill();
      g.beginPath(); g.arc(bx, by, 12 * K, 0, 7); g.fill(); drawFoodBit('berry', bx, by, 5.5 * K);
    }
  }
  for (const c of S.corpses) { // the dead, and the graveyard
    if (c.state === 'carried') continue;
    const base = c.red ? '#9a3020' : '#2a2a2e';
    if (c.state === 'lying') drawAnt(c.x, c.y, { f: c.f, s: AS, col: base, dead: true });
    else {
      const d = c.decay;
      drawAnt(c.x, c.y + d * 5, { f: c.f, s: AS * (1 - d * 0.35), col: mix(base, '#7a5a3c', Math.min(1, d * 1.3)), dead: true, alpha: Math.max(0, 1 - d * d) });
    }
  }
  g.lineCap = 'round'; g.lineWidth = 2.1; // grass
  for (let c = 0; c < 4; c++) {
    g.strokeStyle = BLADE_COL[c]; g.beginPath();
    for (const b of blades) {
      if (b.c !== c || b.x < visL - 20 || b.x > visR + 20) continue;
      const sway = Math.sin(S.t * 1.4 + b.ph + b.x * 0.01) * 2.5 + b.lean;
      g.moveTo(b.x, SURF + 2); g.quadraticCurveTo(b.x + sway * 0.25, SURF - b.h * 0.5, b.x + sway, SURF - b.h);
    }
    g.stroke();
  }
  for (const f of flowers) {
    const sway = Math.sin(S.t * 1.1 + f.x) * 3, tx = f.x + sway, ty = SURF - f.h;
    g.strokeStyle = '#3f8f35'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(f.x, SURF + 2); g.quadraticCurveTo(f.x, SURF - f.h * 0.5, tx, ty); g.stroke();
    g.fillStyle = '#4fa843'; g.beginPath(); g.ellipse(f.x + 6, SURF - f.h * 0.35, 6, 2.5, -0.5, 0, 7); g.fill();
    g.fillStyle = f.c;
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + S.t * 0.1; g.beginPath(); g.ellipse(tx + Math.cos(a) * 6, ty + Math.sin(a) * 6, 4.5, 3, a, 0, 7); g.fill(); }
    g.fillStyle = '#f2a516'; g.beginPath(); g.arc(tx, ty, 3.6, 0, 7); g.fill();
  }
  for (const f of S.food) { // food lying in the meadow
    const r = (6 + Math.sqrt(f.bites) * 5) * K, appear = Math.min(1, (S.t - f.born) * 2);
    drawFoodBit(f.type, f.x, SURF - r * 0.7 * appear + 1, r * appear, f.rot);
  }
  for (const a of S.ants) antDraw(a);
  for (const r of S.invaders) antDraw(r);
  for (const a of S.ants) if (a.showHp) drawHealth(a.x, a.y - 22 * K, a.hp);
  for (const r of S.invaders) if (r.showHp) drawHealth(r.x, r.y - 24 * K, r.hp);
  for (const p of S.parts) { // particles
    if (p.age < 0) continue;
    const t = p.age / p.life, al = 1 - t * t;
    g.globalAlpha = al;
    if (p.k === 'heart') { g.fillStyle = '#ff5c8a'; drawHeart(p.x, p.y, p.s * 1.1 * K); }
    else if (p.k === 'spark') { g.fillStyle = '#fff6b0'; drawStar(p.x, p.y, p.s * 0.6 * K * (1 - t * 0.5), S.t * 3); }
    else if (p.k === 'star') { g.fillStyle = '#ffd84a'; drawStar(p.x, p.y, p.s * 0.9 * K, p.r + S.t * 6); }
    else if (p.k === 'puff') { g.fillStyle = 'rgba(210,180,140,0.7)'; g.beginPath(); g.arc(p.x, p.y, (3 + t * 7) * p.s * K, 0, 7); g.fill(); }
    else if (p.k === 'alert') { // "!" over an ant that has spotted a raider
      g.font = `bold ${18 * K}px system-ui, sans-serif`; g.textAlign = 'center';
      g.lineWidth = 3 * K; g.strokeStyle = '#3a1a0a'; g.strokeText('!', p.x, p.y); g.fillStyle = '#ffe14d'; g.fillText('!', p.x, p.y);
    }
    else if (p.k === 'chomp') { // little white "bite" burst
      g.strokeStyle = '#fff'; g.lineWidth = 1.6 * K; const r = (4 + t * 8) * K;
      g.beginPath(); for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5 + 0.3; g.moveTo(p.x + Math.cos(a) * r * 0.5, p.y + Math.sin(a) * r * 0.5); g.lineTo(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r); } g.stroke();
    }
  }
  g.globalAlpha = 1;
}

// ---- Initial colony --------------------------------------------------------
function init() {
  for (let i = 0; i < 26; i++) {
    const r = Math.random();
    const loc = r < 0.3 ? { node: pick(NESTS), u: rand(-0.7, 0.7) } : r < 0.5 ? (s => ({ node: s, u: storeDropU(s) }))(pick(STORES))
      : r < 0.62 ? { node: 'Q', u: QS * rand(0.45, 0.85) } : r < 0.88 ? { node: 'E', sx: rand(500, 1200) } : { node: pick(['A', 'B', 'C']) };
    const life = rand(220, 440);
    const a = new Ant(loc, rand(40, life - 30), { life }); a.idleT = rand(0, 2.5); S.ants.push(a);
  }
  for (const s of STORES) for (let i = 0; i < 10; i++) S.stores[s].push(pick(Object.keys(FOOD)));
  const mk = (nest, stage, slot, extra) => { const b = { id: uid++, stage, where: 'nursery', nest, slot, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: rand(0, 6), ...extra }; S.nest[nest][slot] = b; S.brood.push(b); };
  mk('N1', 'egg', 0, { t: 6 }); mk('N1', 'larva', 2, { fed: 1, since: 5 }); mk('N1', 'larva', 4, { fed: 2, since: 2 }); mk('N1', 'pupa', 7, { t: 4 });
  mk('N2', 'larva', 1, { since: 6 }); mk('N2', 'egg', 3, { t: 10 }); mk('N2', 'pupa', 6, { t: 12, fed: 3 });
  S.brood.push({ id: uid++, stage: 'egg', where: 'queen', nest: null, slot: 0, t: 0, fed: 0, since: 0, claimed: false, hungry: false, x: 0, y: 0, wig: 0 });
  for (let i = 0; i < 3; i++) { S.nextFood = 0; updateFood(0); }
  S.nextFood = 3;
}

// ---- Main loop -----------------------------------------------------------
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000) * SPEED; last = now;
  while (dt > 0) { const h = Math.min(dt, 1 / 30); update(h); dt -= h; }
  render();
  requestAnimationFrame(frame);
}
// On phones/tablets, a tap goes full screen and locks landscape where the browser allows it.
addEventListener('pointerup', () => {
  if (!COARSE || document.fullscreenElement || !document.documentElement.requestFullscreen) return;
  document.documentElement.requestFullscreen({ navigationUI: 'hide' })
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
});
addEventListener('resize', resize);
resize(); init();
window.__sim = { S, update, render, N, CH, spawnRaid };
requestAnimationFrame(frame);
</script>
